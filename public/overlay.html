<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AICaptions - Live OBS Overlay</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { margin: 0; padding: 20px; background: transparent; overflow: hidden; font-family: system-ui, -apple-system, sans-serif; }
    #caption-container { position: fixed; bottom: 40px; left: 5%; right: 5%; text-align: center; pointer-events: none; }
    .caption-text { font-size: 2.2rem; font-weight: 700; color: #ffffff; text-shadow: 2px 2px 4px #000, -2px -2px 4px #000; background: rgba(0, 0, 0, 0.8); padding: 12px 24px; border-radius: 8px; display: inline-block; max-width: 90vw; }
  </style>
</head>
<body>
  <div id="caption-container">
    <div id="captions" class="caption-text">Connecting to caption stream...</div>
  </div>

  <script>
    const SUPABASE_URL = 'https://euopdmwtowuxdzczwbul.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_UQHJUuyX1-nHwpJ6ilgD7g_BZ0vNUWB';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const urlParams = new URLSearchParams(window.location.search);
    const roomId = urlParams.get('room') || 'main-stage';
    let activeTargetLang = urlParams.get('target_lang') || localStorage.getItem('target_lang') || 'none';

    const captionsDiv = document.getElementById('captions');
    let socket = null;

    function connect() {
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${protocol}//${location.host}?room=${encodeURIComponent(roomId)}&role=viewer&target_lang=${encodeURIComponent(activeTargetLang)}`;

      socket = new WebSocket(wsUrl);

      socket.onopen = () => {
        captionsDiv.innerText = "Waiting for live captions...";
      };

      socket.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          if (data.type === 'caption') {
            captionsDiv.innerText = data.translation || data.text;
          }
        } catch (e) {}
      };

      socket.onclose = () => {
        setTimeout(connect, 3000);
      };
    }

    // Listen to real-time tab switching from Presenter
    supabaseClient.channel(`room_${roomId}`)
      .on('broadcast', { event: 'target_lang_change' }, (payload) => {
        if (payload.payload?.targetLang) {
          activeTargetLang = payload.payload.targetLang;
          localStorage.setItem('target_lang', activeTargetLang);
          if (socket) { socket.onclose = null; socket.close(); }
          connect();
        }
      })
      .subscribe();

    connect();
  </script>
</body>
</html>
