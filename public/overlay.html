<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AICaptions - Live OBS Overlay</title>

  <!-- Supabase JS Client SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      padding: 20px;
      background: transparent;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #caption-container {
      position: fixed;
      bottom: 40px;
      left: 5%;
      right: 5%;
      text-align: center;
      pointer-events: none;
    }
    .caption-text {
      font-size: 2.2rem;
      font-weight: 700;
      color: #ffffff;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.9), -2px -2px 4px rgba(0, 0, 0, 0.9);
      background: rgba(0, 0, 0, 0.75);
      padding: 12px 24px;
      border-radius: 8px;
      display: inline-block;
      max-width: 90vw;
      line-height: 1.3;
      word-wrap: break-word;
      transition: opacity 0.2s ease-in-out;
    }
  </style>
</head>
<body>
  <div id="caption-container">
    <div id="captions" class="caption-text">Connecting to caption stream...</div>
  </div>

  <script>
    // 1. Supabase Initialization
    const SUPABASE_URL = 'https://euopdmwtowuxdzczwbul.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_UQHJUuyX1-nHwpJ6ilgD7g_BZ0vNUWB';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Read Query Parameters
    const urlParams = new URLSearchParams(window.location.search);
    const roomId = urlParams.get('room') || urlParams.get('roomId') || 'main-stage';
    let activeTargetLang = urlParams.get('target_lang') || urlParams.get('lang') || localStorage.getItem('target_lang') || 'none';

    // Set Backend Host (Use explicit server URL if hosted separately on Render, e.g., 'your-api.onrender.com')
    const SERVER_HOST = urlParams.get('server') || window.location.host;

    const captionsDiv = document.getElementById('captions');
    let socket = null;
    let roomBroadcastChannel = null;

    // 2. Listen for Live Language Switches from Presenter
    function subscribeToRoomChannel() {
      if (roomBroadcastChannel) supabaseClient.removeChannel(roomBroadcastChannel);

      roomBroadcastChannel = supabaseClient.channel(`room_${roomId}`);

      roomBroadcastChannel
        .on('broadcast', { event: 'target_lang_change' }, (payload) => {
          if (payload.payload && payload.payload.targetLang) {
            const newLang = payload.payload.targetLang;
            if (newLang !== activeTargetLang) {
              activeTargetLang = newLang;
              localStorage.setItem('target_lang', activeTargetLang);
              console.log(`[Overlay] Target language updated to: ${activeTargetLang}`);
              reconnectWebSocket();
            }
          }
        })
        .subscribe();
    }

    // 3. Connect to Render WebSocket Backend
    function connect() {
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${protocol}//${SERVER_HOST}?room=${encodeURIComponent(roomId)}&role=viewer&target_lang=${encodeURIComponent(activeTargetLang)}`;

      socket = new WebSocket(wsUrl);

      socket.onopen = () => {
        console.log(`[Overlay] Connected to room: ${roomId} (Target: ${activeTargetLang})`);
        captionsDiv.innerText = "Waiting for live captions...";
      };

      socket.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          processIncomingCaption(data);
        } catch (err) {
          console.error("[Overlay] Failed to parse WebSocket payload:", err);
        }
      };

      socket.onclose = () => {
        console.warn("[Overlay] Disconnected. Reconnecting in 3 seconds...");
        captionsDiv.innerText = "Reconnecting...";
        setTimeout(connect, 3000);
      };

      socket.onerror = (err) => {
        console.error("[Overlay] WebSocket Error:", err);
      };
    }

    // 4. Integrated Deepgram Video Block Frame Receiver
    // Listens for cross-document window events if Deepgram translations are pushed via postMessage from a presenter shell
    function initDeepgramFrameReceiver() {
      window.addEventListener('message', (event) => {
        // Optional security filter: uncomment if the presenter video block is hosted on an isolated domain
        // if (event.origin !== 'https://your-presenter-domain.com') return;

        try {
          const data = typeof event.data === 'string' ? JSON.parse(event.data) : event.data;
          
          // Checks if message matches standard Deepgram translation/caption schema structures
          if (data && (data.type === 'caption' || data.type === 'translation' || data.channel?.alternatives)) {
            processIncomingCaption(data);
          }
        } catch (err) {
          // Non-critical: Ignore messages if parent frame emits unrelated string messages
        }
      });
      console.log("[Overlay] Deepgram cross-frame event listener initialized.");
    }

    // 5. Shared Caption Text Parsing Core Engine
    function processIncomingCaption(data) {
      const shortLang = activeTargetLang.split('-')[0];

      // Deepgram direct socket structure normalization fallback
      const deepgramTranscript = data.channel?.alternatives?.[0]?.transcript;

      // Extract translated text checking standard translation fields and Deepgram structure extensions
      const displayText = 
        (data.translations && data.translations[activeTargetLang]) ||
        (data.translations && data.translations[shortLang]) ||
        data.translation ||
        data.translated_text ||
        data.translatedText ||
        deepgramTranscript ||
        data.text;

      if (displayText && displayText.trim() !== "") {
        captionsDiv.innerText = displayText;
      }
    }

    function reconnectWebSocket() {
      if (socket) {
        socket.onclose = null;
        socket.close();
      }
      connect();
    }

    // Initialization Pipelines
    subscribeToRoomChannel();
    connect();
    initDeepgramFrameReceiver();

    window.addEventListener('beforeunload', () => {
      if (roomBroadcastChannel) supabaseClient.removeChannel(roomBroadcastChannel);
      if (socket) socket.close();
    });
  </script>
</body>
</html>
