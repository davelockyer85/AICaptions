<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AICaptions - OBS Overlay</title>
  <style>
    body { margin: 0; padding: 20px; background: transparent; overflow: hidden; font-family: sans-serif; }
    #captions {
      font-size: 2.2rem;
      font-weight: bold;
      color: #ffffff;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.9), -2px -2px 4px rgba(0,0,0,0.9);
      background: rgba(0, 0, 0, 0.6);
      padding: 12px 20px;
      border-radius: 8px;
      display: inline-block;
      max-width: 90vw;
    }
  </style>
</head>
<body>
  <div id="captions">Waiting for live captions...</div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const roomId = urlParams.get('roomId') || 'default';
    const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws = new WebSocket(`${wsProtocol}//${window.location.host}?roomId=${roomId}&role=viewer`);

    const captionsDiv = document.getElementById('captions');

    ws.onmessage = (event) => {
      const data = JSON.parse(event.data);
      if (data.type === 'caption') {
        captionsDiv.innerText = data.text;
      }
    };
  </script>
</body>
</html>
