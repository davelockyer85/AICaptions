<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Stage Captions - Transparent Overlay</title>
  <style>
    /* Absolute transparency for OBS, vMix, and broadcast switchers */
    html, body {
      background-color: rgba(0, 0, 0, 0) !important;
      background: transparent !important;
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-end; /* Places captions in lower-third position */
      align-items: center;
    }

    #caption-container {
      width: 90%;
      max-width: 1400px;
      margin-bottom: 60px;
      text-align: center;
    }

    #captionBox {
      display: inline-block;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 3.2rem;
      font-weight: 700;
      line-height: 1.3;
      letter-spacing: 0.02em;
      
      /* Crisp text outline & drop shadow for high contrast over light and dark video */
      text-shadow: 
        2px  2px 0px #000,
       -2px -2px 0px #000,
        2px -2px 0px #000,
       -2px  2px 0px #000,
        0px  4px 12px rgba(0, 0, 0, 0.9);

      /* Subtle semi-transparent backing pill */
      background: rgba(15, 23, 42, 0.65);
      padding: 0.8rem 2rem;
      border-radius: 16px;
      backdrop-filter: blur(4px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      
      transition: all 0.15s ease-out;
    }

    /* Optional fade styling for interim results */
    .interim {
      opacity: 0.85;
      font-style: italic;
    }
  </style>
</head>
<body>

  <div id="caption-container">
    <div id="captionBox">Waiting for live audio...</div>
  </div>

  <script>
    const captionBox = document.getElementById("captionBox");
    const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
    const wsUrl = `${protocol}//${window.location.host}/ws/overlay`;
    let socket;

    function connect() {
      socket = new WebSocket(wsUrl);

      socket.onopen = () => {
        captionBox.innerText = "";
        captionBox.style.display = "none"; // Hide box until audio starts
      };

      socket.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          if (data.text && data.text.trim().length > 0) {
            captionBox.style.display = "inline-block";
            captionBox.innerText = data.text;
            
            if (data.isFinal) {
              captionBox.classList.remove("interim");
            } else {
              captionBox.classList.add("interim");
            }
          }
        } catch (err) {
          console.error("Error parsing overlay payload:", err);
        }
      };

      socket.onclose = () => {
        captionBox.style.display = "inline-block";
        captionBox.classList.remove("interim");
        captionBox.innerText = "[Overlay Reconnecting...]";
        setTimeout(connect, 2000); // Auto-reconnect if socket drops
      };

      socket.onerror = (err) => {
        console.error("WebSocket Error:", err);
      };
    }

    connect();
  </script>
</body>
</html>
