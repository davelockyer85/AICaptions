<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AICaptions - Live OBS Overlay</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: transparent;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #caption-container {
      position: fixed;
      bottom: 40px;
      left: 5%;
      right: 5%;
      text-align: center;
      pointer-events: none;
    }
    .caption-text {
      font-size: 2.2rem;
      font-weight: 700;
      color: #ffffff;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.9), -2px -2px 4px rgba(0, 0, 0, 0.9);
      background: rgba(0, 0, 0, 0.75);
      padding: 12px 24px;
      border-radius: 8px;
      display: inline-block;
      max-width: 90vw;
      line-height: 1.3;
      word-wrap: break-word;
      transition: opacity 0.2s ease-in-out;
    }
  </style>
</head>
<body>
  <div id="caption-container">
    <div id="captions" class="caption-text">Connecting to caption stream...</div>
  </div>

  <script>
    // Handle both ?room= and ?roomId= query parameters
    const urlParams = new URLSearchParams(window.location.search);
    const roomId = urlParams.get('room') || urlParams.get('roomId') || 'main-stage';

    const captionsDiv = document.getElementById('captions');
    let socket = null;

    function connect() {
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${protocol}//${window.location.host}?room=${encodeURIComponent(roomId)}&role=viewer`;

      socket = new WebSocket(wsUrl);

      socket.onopen = () => {
        console.log(`[Overlay] Connected to room: ${roomId}`);
        captionsDiv.innerText = "Waiting for live captions...";
      };

      socket.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          console.log("[Overlay] Received event:", data);

          if (data.type === 'caption' && data.text) {
            captionsDiv.innerText = data.text;
          }
        } catch (err) {
          console.error("[Overlay] Failed to parse payload:", err);
        }
      };

      socket.onclose = () => {
        console.warn("[Overlay] Disconnected. Reconnecting in 3 seconds...");
        captionsDiv.innerText = "Reconnecting...";
        setTimeout(connect, 3000);
      };

      socket.onerror = (err) => {
        console.error("[Overlay] WebSocket Error:", err);
      };
    }

    connect();
  </script>
</body>
</html>
