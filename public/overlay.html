<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AICaptions - Live OBS Overlay</title>

  <!-- Supabase JS Client SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      padding: 20px;
      background: transparent;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #caption-container {
      position: fixed;
      bottom: 40px;
      left: 5%;
      right: 5%;
      text-align: center;
      pointer-events: none;
    }
    .caption-text {
      font-size: 2.2rem;
      font-weight: 700;
      color: #ffffff;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.9), -2px -2px 4px rgba(0, 0, 0, 0.9);
      background: rgba(0, 0, 0, 0.75);
      padding: 12px 24px;
      border-radius: 8px;
      display: inline-block;
      max-width: 90vw;
      line-height: 1.3;
      word-wrap: break-word;
      transition: opacity 0.2s ease-in-out;
    }
  </style>
</head>
<body>
  <div id="caption-container">
    <div id="captions" class="caption-text">Connecting to caption stream...</div>
  </div>

  <script>
    // 1. Supabase Initialization
    const SUPABASE_URL = 'https://euopdmwtowuxdzczwbul.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_UQHJUuyX1-nHwpJ6ilgD7g_BZ0vNUWB';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Read Query Parameters
    const urlParams = new URLSearchParams(window.location.search);
    const roomId = urlParams.get('room') || urlParams.get('roomId') || 'main-stage';
    let activeTargetLang = urlParams.get('target_lang') || urlParams.get('lang') || localStorage.getItem('target_lang') || 'en';

    // Set Backend Host
    const SERVER_HOST = urlParams.get('server') || window.location.host;

    const captionsDiv = document.getElementById('captions');
    let socket = null;
    let roomBroadcastChannel = null;

    // 2. Listen for Live Language Switches from Presenter
    function subscribeToRoomChannel() {
      if (roomBroadcastChannel) supabaseClient.removeChannel(roomBroadcastChannel);

      roomBroadcastChannel = supabaseClient.channel(`room_${roomId}`);

      roomBroadcastChannel
        .on('broadcast', { event: 'target_lang_change' }, (payload) => {
          if (payload.payload && payload.payload.targetLang) {
            const newLang = payload.payload.targetLang;
            if (newLang !== activeTargetLang) {
              activeTargetLang = newLang;
              localStorage.setItem('target_lang', activeTargetLang);
              console.log(`[Overlay] Target language updated to: ${activeTargetLang}`);
              reconnectWebSocket();
            }
          }
        })
        .subscribe();
    }

    // 3. Connect to WebSocket Backend
    function connect() {
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      
      // FIX 1: Include explicit '/ws/overlay' route path & role
      const wsUrl = `${protocol}//${SERVER_HOST}/ws/overlay?room=${encodeURIComponent(roomId)}&role=overlay&lang=${encodeURIComponent(activeTargetLang)}`;

      socket = new WebSocket(wsUrl);

      socket.onopen = () => {
        console.log(`[Overlay] Connected to room: ${roomId} (Target: ${activeTargetLang})`);
        captionsDiv.innerText = "Waiting for live captions...";
      };

      socket.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);

          // FIX 2 & 3: Fall back across all standard payload key names
          const shortLang = activeTargetLang ? activeTargetLang.split('-')[0] : 'en';

          const displayText = 
            (data.translations && data.translations[activeTargetLang]) ||
            (data.translations && data.translations[shortLang]) ||
            data.translation ||
            data.translated_text ||
            data.translatedText ||
            data.text;

          if (displayText && displayText.trim().length > 0) {
            captionsDiv.innerText = displayText;
          }
        } catch (err) {
          console.error("[Overlay] Failed to parse payload:", err);
        }
      };

      socket.onclose = () => {
        console.warn("[Overlay] Disconnected. Reconnecting in 3 seconds...");
        captionsDiv.innerText = "Reconnecting...";
        setTimeout(connect, 3000);
      };

      socket.onerror = (err) => {
        console.error("[Overlay] WebSocket Error:", err);
      };
    }

    function reconnectWebSocket() {
      if (socket) {
        socket.onclose = null;
        socket.close();
      }
      connect();
    }

    subscribeToRoomChannel();
    connect();

    window.addEventListener('beforeunload', () => {
      if (roomBroadcastChannel) supabaseClient.removeChannel(roomBroadcastChannel);
      if (socket) socket.close();
    });
  </script>
</body>
</html>
