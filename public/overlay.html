<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OBS / Stage Caption Overlay</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: transparent; /* Transparent background for keying */
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
    }
    #caption-box {
      position: absolute;
      bottom: 40px;
      left: 5%;
      right: 5%;
      background: rgba(0, 0, 0, 0.85);
      color: #ffffff;
      padding: 20px 30px;
      border-radius: 12px;
      font-size: 32px;
      line-height: 1.4;
      font-weight: 600;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
      min-height: 80px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>
  <div id="caption-box">Waiting for audio live stream...</div>

  <script>
    const box = document.getElementById("caption-box");

    // Read room and target translation language from URL query parameters
    const urlParams = new URLSearchParams(window.location.search);
    const room = urlParams.get("room") || urlParams.get("roomId") || "main-stage";
    const lang = urlParams.get("lang") || urlParams.get("target_lang") || "en";

    let socket = null;

    function connect() {
      const protocol = location.protocol === "https:" ? "wss:" : "ws:";
      
      // Construct WebSocket URL matching presenter parameters and path options
      const basePath = location.pathname.startsWith('/ws') ? '/ws/overlay' : '';
      const wsUrl = `${protocol}//${location.host}${basePath}?room=${encodeURIComponent(room)}&role=overlay&lang=${encodeURIComponent(lang)}`;

      socket = new WebSocket(wsUrl);

      socket.onopen = () => {
        console.log(`[Overlay] Connected to room: ${room}`);
        box.innerText = "Connected. Waiting for live captions...";
      };

      socket.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          
          // Extract text across all server response formats
          const displayText = 
            (data.translations && data.translations[lang]) ||
            data.translation ||
            data.translated_text ||
            data.text ||
            (typeof data === "string" ? data : null);

          if (displayText && displayText.trim().length > 0) {
            box.innerText = displayText;
          }
        } catch (err) {
          if (typeof event.data === "string" && event.data.trim().length > 0) {
            box.innerText = event.data;
          }
        }
      };

      socket.onclose = () => {
        box.innerText = "Reconnecting to stream...";
        setTimeout(connect, 3000);
      };

      socket.onerror = (err) => {
        console.error("Overlay WebSocket Error:", err);
      };
    }

    connect();
  </script>
</body>
</html>
