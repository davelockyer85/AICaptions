    let selectedLang = "en";
    function setLanguage(langCode, btnElement) {
      selectedLang = langCode;
      // Update UI tab selection styles
      document.querySelectorAll(".tab").forEach(tab => tab.classList.remove("active"));
      btnElement.classList.add("active");
      // Send language switch event over WebSocket if connected
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: "set_language", lang: selectedLang }));
        console.log(`[Presenter] Switched overlay target language to: ${selectedLang}`);
      }
}
    startBtn.onclick = async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const protocol = location.protocol === "https:" ? "wss:" : "ws:";
        ws = new WebSocket(`${protocol}//${location.host}/ws/ingest`);
        ws.onopen = () => {
          status.innerText = "Status: Live & Streaming Stage Audio";
          status.style.color = "#10b981";
          // Send initial language preference
          ws.send(JSON.stringify({ type: "set_language", lang: selectedLang }));
          let options = {};
          if (MediaRecorder.isTypeSupported("audio/webm")) {
            options = { mimeType: "audio/webm" };
          } else if (MediaRecorder.isTypeSupported("audio/mp4")) {
            options = { mimeType: "audio/mp4" };
          }
          mediaRecorder = new MediaRecorder(stream, options);
          mediaRecorder.ondataavailable = (e) => {
            if (e.data.size > 0 && ws.readyState === WebSocket.OPEN) {
              ws.send(e.data);
            }
};
          mediaRecorder.start(250);
        };
        ws.onclose = () => {
          status.innerText = "Status: Disconnected";
          status.style.color = "#ef4444";
};
        ws.onerror = (err) => {
          console.error("WebSocket Error:", err);
};
      } catch (err) {
        console.error("Mic Error:", err);
        status.innerText = "Status: Microphone Access Denied";
        status.style.color = "#ef4444";
} };
  </script>
