<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Presenter Audio Ingest - AICaptions</title>

  <!-- Supabase JS Client SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #111827;
      color: #f3f4f6;
      padding: 2rem;
      text-align: center;
      margin: 0;
    }
    .card {
      max-width: 580px;
      margin: 1rem auto;
      background: #1f2937;
      padding: 2rem;
      border-radius: 12px;
      border: 1px solid #374151;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
    }
    h1 { margin-top: 0; color: #60a5fa; font-size: 1.75rem; }
    p { color: #9ca3af; }
    .room-badge {
      display: inline-block;
      background: #374151;
      color: #93c5fd;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-family: monospace;
      font-weight: bold;
      margin-bottom: 1rem;
    }
    .timer-badge {
      display: block;
      background: #111827;
      border: 1px solid #374151;
      color: #38bdf8;
      font-size: 1.25rem;
      font-weight: 700;
      font-family: monospace;
      padding: 0.6rem 1rem;
      border-radius: 8px;
      margin: 1rem 0;
    }
    .setting-group {
      margin-top: 1rem;
      text-align: left;
    }
    label {
      display: block;
      font-size: 0.85rem;
      color: #9ca3af;
      margin-bottom: 0.35rem;
      font-weight: 600;
    }
    select {
      width: 100%;
      padding: 0.6rem 0.8rem;
      background-color: #111827;
      color: #f3f4f6;
      border: 1px solid #374151;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
      cursor: pointer;
    }
    .targets-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 10px;
      margin-top: 0.5rem;
    }
    .btn-group {
      display: flex;
      gap: 1rem;
      justify-content: center;
      margin-top: 1.5rem;
    }
    button {
      padding: 0.85rem 1.75rem;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    #startBtn { background: #2563eb; color: white; }
    #startBtn:hover { background: #1d4ed8; }
    #startBtn:disabled { background: #4b5563; cursor: not-allowed; }
    #stopBtn { background: #dc2626; color: white; }
    #stopBtn:hover { background: #b91c1c; }
    #stopBtn:disabled { background: #4b5563; cursor: not-allowed; }
    #status {
      margin-top: 1.5rem;
      font-weight: 600;
      font-size: 1.1rem;
      color: #9ca3af;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Stage Audio Transmitter</h1>
    <p>Room Identifier:</p>
    <div class="room-badge" id="roomDisplay">main-stage</div>

    <div class="timer-badge" id="timerDisplay">Remaining Time: --:--</div>

    <!-- Spoken Input Language -->
    <div class="setting-group">
      <label for="languageSelect">Spoken Input Language</label>
      <select id="languageSelect"></select>
    </div>

    <!-- Up to 5 Active Translation Output Channels -->
    <div class="setting-group">
      <label>Active Output Translations (Max 5 Channels)</label>
      <div class="targets-grid">
        <div>
          <label style="font-size: 0.75rem; color: #60a5fa;">Output Channel 1</label>
          <select class="target-select" id="target1"></select>
        </div>
        <div>
          <label style="font-size: 0.75rem; color: #60a5fa;">Output Channel 2</label>
          <select class="target-select" id="target2"></select>
        </div>
        <div>
          <label style="font-size: 0.75rem; color: #60a5fa;">Output Channel 3</label>
          <select class="target-select" id="target3"></select>
        </div>
        <div>
          <label style="font-size: 0.75rem; color: #60a5fa;">Output Channel 4</label>
          <select class="target-select" id="target4"></select>
        </div>
        <div>
          <label style="font-size: 0.75rem; color: #60a5fa;">Output Channel 5</label>
          <select class="target-select" id="target5"></select>
        </div>
      </div>
    </div>

    <div class="btn-group">
      <button id="startBtn">Start Streaming</button>
      <button id="stopBtn" disabled>Stop</button>
    </div>

    <p id="status">Status: Disconnected</p>
  </div>

  <script>
    const SUPABASE_URL = 'https://euopdmwtowuxdzczwbul.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_UQHJUuyX1-nHwpJ6ilgD7g_BZ0vNUWB';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUser = null;
    let syncTimer = null;
    let localCountdownTimer = null;
    let realtimeChannel = null;
    const UPDATE_INTERVAL_SECONDS = 5;
    let maxLimit = 3600;
    let currentRemainingSeconds = 0;

    async function initPresenterAuth() {
      try {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (session && session.user) {
          currentUser = session.user;
          await fetchUserTimeAndSubscribe(currentUser.id);
        }
      } catch (err) {
        console.warn("Could not retrieve Supabase session:", err.message);
      }
    }

    async function fetchUserTimeAndSubscribe(userId) {
      if (!userId) return;

      try {
        const { data: user, error } = await supabaseClient
          .from('users')
          .select('streaming_seconds_used, max_streaming_seconds')
          .eq('user_id', userId)
          .single();

        if (!error && user) {
          applyTimeLimits(user.streaming_seconds_used || 0, user.max_streaming_seconds ?? maxLimit);
        }

        subscribeToRealtimeUsage(userId);
      } catch (e) {
        console.warn("Initial user state fetch error:", e.message);
      }
    }

    function subscribeToRealtimeUsage(userId) {
      if (realtimeChannel) supabaseClient.removeChannel(realtimeChannel);

      realtimeChannel = supabaseClient
        .channel(`presenter_time_${userId}`)
        .on(
          'postgres_changes',
          { event: 'UPDATE', schema: 'public', table: 'users', filter: `user_id=eq.${userId}` },
          (payload) => {
            if (payload.new) {
              const used = payload.new.streaming_seconds_used || 0;
              const maxSecs = payload.new.max_streaming_seconds ?? maxLimit;
              applyTimeLimits(used, maxSecs);
            }
          }
        )
        .subscribe((status, err) => {
          if (status === 'CHANNEL_ERROR') {
            console.warn("Realtime subscription error:", err);
          }
        });
    }

    function applyTimeLimits(usedSecs, allowedMaxSecs) {
      currentRemainingSeconds = Math.max(0, allowedMaxSecs - usedSecs);
      updateTimerDisplay(currentRemainingSeconds);

      if (currentRemainingSeconds <= 0) {
        if (isStreamingActive()) {
          cleanup();
          status.innerText = "Status: Terminated — Maximum Time Limit Reached";
          status.style.color = "#ef4444";
          alert(`Stream stopped: You have reached your maximum streaming limit.`);
        } else {
          status.innerText = `Status: Time Limit Exceeded (${Math.floor(usedSecs/60)}/${Math.floor(allowedMaxSecs/60)} mins)`;
          status.style.color = "#ef4444";
          startBtn.disabled = true;
        }
      }
    }

    function updateTimerDisplay(totalSeconds) {
      const timerDisplay = document.getElementById('timerDisplay');
      if (!timerDisplay) return;

      const mins = Math.floor(totalSeconds / 60);
      const secs = totalSeconds % 60;
      const formatted = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;

      timerDisplay.innerText = `Remaining Time: ${formatted}`;

      if (totalSeconds <= 60) {
        timerDisplay.style.color = '#ef4444';
      } else if (totalSeconds <= 300) {
        timerDisplay.style.color = '#f59e0b';
      } else {
        timerDisplay.style.color = '#38bdf8';
      }
    }

    function startLocalCountdown() {
      stopLocalCountdown();
      localCountdownTimer = setInterval(() => {
        if (currentRemainingSeconds > 0) {
          currentRemainingSeconds--;
          updateTimerDisplay(currentRemainingSeconds);

          if (currentRemainingSeconds <= 0) {
            cleanup();
            status.innerText = "Status: Terminated — Maximum Time Limit Reached";
            status.style.color = "#ef4444";
            alert(`Stream stopped: You have run out of streaming time.`);
          }
        }
      }, 1000);
    }

    function stopLocalCountdown() {
      if (localCountdownTimer) {
        clearInterval(localCountdownTimer);
        localCountdownTimer = null;
      }
    }

    function startUsageSyncing(userId, roomId) {
      stopUsageSyncing();
      syncTimer = setInterval(async () => {
        await pushUsageToSupabase(userId, roomId, UPDATE_INTERVAL_SECONDS);
      }, UPDATE_INTERVAL_SECONDS * 1000);
    }

    async function pushUsageToSupabase(userId, roomId, secondsToAdd) {
      if (!userId) return;

      try {
        const { data: user, error: userErr } = await supabaseClient
          .from('users')
          .select('streaming_seconds_used, max_streaming_seconds')
          .eq('user_id', userId)
          .single();

        if (userErr || !user) return;

        const currentUsed = user.streaming_seconds_used || 0;
        const allowedMax = user.max_streaming_seconds ?? maxLimit;
        const newTotal = currentUsed + secondsToAdd;

        if (newTotal >= allowedMax) {
          await supabaseClient
            .from('users')
            .update({ streaming_seconds_used: allowedMax })
            .eq('user_id', userId);

          cleanup();
          status.innerText = "Status: Terminated — Maximum Time Limit Reached";
          status.style.color = "#ef4444";
          alert(`Stream stopped: You have reached your maximum streaming limit.`);
          return;
        }

        await supabaseClient
          .from('users')
          .update({ streaming_seconds_used: newTotal })
          .eq('user_id', userId);

        if (roomId) {
          const { data: room } = await supabaseClient
            .from('rooms')
            .select('streaming_seconds_used')
            .eq('room_id', roomId)
            .single();

          if (room) {
            await supabaseClient
              .from('rooms')
              .update({ streaming_seconds_used: (room.streaming_seconds_used || 0) + secondsToAdd })
              .eq('room_id', roomId);
          }
        }
      } catch (err) {
        console.warn("Usage sync error:", err.message);
      }
    }

    function stopUsageSyncing() {
      if (syncTimer) {
        clearInterval(syncTimer);
        syncTimer = null;
      }
    }

    function isStreamingActive() {
      return mediaRecorder && mediaRecorder.state !== 'inactive';
    }

    const SUPPORTED_LANGUAGES = [
      { code: 'none', name: '-- None / Disabled --' },
      { code: 'en-US', name: 'English (US)' },
      { code: 'en-GB', name: 'English (UK)' },
      { code: 'es-ES', name: 'Spanish (Spain)' },
      { code: 'es-419', name: 'Spanish (Latin America)' },
      { code: 'fr-FR', name: 'French' },
      { code: 'de-DE', name: 'German' },
      { code: 'zh-CN', name: 'Chinese (Simplified)' },
      { code: 'zh-TW', name: 'Chinese (Traditional)' },
      { code: 'ja-JP', name: 'Japanese' },
      { code: 'ko-KR', name: 'Korean' },
      { code: 'ar-SA', name: 'Arabic' },
      { code: 'hi-IN', name: 'Hindi' },
      { code: 'pt-BR', name: 'Portuguese (Brazil)' },
      { code: 'ru-RU', name: 'Russian' },
      { code: 'it-IT', name: 'Italian' },
      { code: 'nl-NL', name: 'Dutch' },
      { code: 'pl-PL', name: 'Polish' },
      { code: 'tr-TR', name: 'Turkish' },
      { code: 'uk-UA', name: 'Ukrainian' },
      { code: 'vi-VN', name: 'Vietnamese' },
      { code: 'th-TH', name: 'Thai' },
      { code: 'id-ID', name: 'Indonesian' }
    ];

    function initLanguageSelectors() {
      const srcSelect = document.getElementById('languageSelect');
      const targetSelects = [
        document.getElementById('target1'),
        document.getElementById('target2'),
        document.getElementById('target3'),
        document.getElementById('target4'),
        document.getElementById('target5')
      ];

      srcSelect.innerHTML = '';
      SUPPORTED_LANGUAGES.filter(l => l.code !== 'none').forEach(lang => {
        const opt = document.createElement('option');
        opt.value = lang.code;
        opt.textContent = `${lang.name} (${lang.code})`;
        if (lang.code === (localStorage.getItem('presenter_lang') || 'en-US')) opt.selected = true;
        srcSelect.appendChild(opt);
      });

      const savedTargets = JSON.parse(localStorage.getItem('presenter_targets') || '["es-ES", "fr-FR", "de-DE", "zh-CN", "none"]');

      targetSelects.forEach((sel, idx) => {
        sel.innerHTML = '';
        SUPPORTED_LANGUAGES.forEach(lang => {
          const opt = document.createElement('option');
          opt.value = lang.code;
          opt.textContent = lang.code === 'none' ? lang.name : `${lang.name} (${lang.code})`;
          if (lang.code === (savedTargets[idx] || 'none')) opt.selected = true;
          sel.appendChild(opt);
        });

        sel.addEventListener('change', pushLiveLanguageUpdate);
      });

      srcSelect.addEventListener('change', pushLiveLanguageUpdate);
    }

    function getSelectedTargets() {
      return [
        document.getElementById('target1').value,
        document.getElementById('target2').value,
        document.getElementById('target3').value,
        document.getElementById('target4').value,
        document.getElementById('target5').value
      ];
    }

    function pushLiveLanguageUpdate() {
      const spokenLang = document.getElementById('languageSelect').value;
      const targetArray = getSelectedTargets();
      const activeTargets = targetArray.filter(code => code !== 'none');

      localStorage.setItem('presenter_lang', spokenLang);
      localStorage.setItem('presenter_targets', JSON.stringify(targetArray));

      if (ws && ws.readyState === WebSocket.OPEN) {
        console.log("[Presenter] Sending language configuration update frame:", { spokenLang, activeTargets });
        ws.send(JSON.stringify({
          type: 'config_update',
          spokenLang: spokenLang,
          sourceLang: spokenLang,
          lang: spokenLang,
          targets: activeTargets,
          targetLangs: activeTargets,
          targetLang: activeTargets[0] || ''
        }));
      }
    }

    const urlParams = new URLSearchParams(window.location.search);
    const room = urlParams.get('room') || urlParams.get('roomId') || 'main-stage';
    const parsedMaxLimit = parseInt(urlParams.get('maxLimit'), 10);
    if (!isNaN(parsedMaxLimit) && parsedMaxLimit > 0) maxLimit = parsedMaxLimit;

    const urlToken = urlParams.get('token');
    const localToken = localStorage.getItem('supabase.auth.token') 
      ? JSON.parse(localStorage.getItem('supabase.auth.token'))?.currentSession?.access_token 
      : null;
    const token = urlToken || localToken || '';

    document.getElementById('roomDisplay').innerText = room;
    initLanguageSelectors();
    initPresenterAuth();

    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const status = document.getElementById('status');

    let ws = null;
    let mediaRecorder = null;
    let audioStream = null;

    startBtn.onclick = async () => {
      if (currentRemainingSeconds <= 0) {
        alert("Cannot start streaming: Your maximum allowed streaming time has been reached.");
        return;
      }

      try {
        status.innerText = "Status: Requesting Microphone Access...";
        status.style.color = "#f59e0b";

        audioStream = await navigator.mediaDevices.getUserMedia({ 
          audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } 
        });

        const selectedLang = document.getElementById('languageSelect').value;
        const activeTargets = getSelectedTargets().filter(code => code !== 'none');
        const targetString = activeTargets.join(',');

        const protocol = location.protocol === "https:" ? "wss:" : "ws:";
        
        // Populate all standard query parameter aliases to support any backend WS router logic
        let wsUrl = `${protocol}//${location.host}?room=${encodeURIComponent(room)}&role=presenter` +
                    `&lang=${encodeURIComponent(selectedLang)}` +
                    `&sourceLang=${encodeURIComponent(selectedLang)}` +
                    `&spokenLang=${encodeURIComponent(selectedLang)}` +
                    `&targets=${encodeURIComponent(targetString)}` +
                    `&targetLangs=${encodeURIComponent(targetString)}` +
                    `&targetLang=${encodeURIComponent(activeTargets[0] || '')}`;

        if (token) wsUrl += `&token=${encodeURIComponent(token)}`;

        ws = new WebSocket(wsUrl);
        ws.binaryType = 'arraybuffer';

        ws.onopen = () => {
          status.innerText = "Status: Live & Streaming Stage Audio";
          status.style.color = "#10b981";

          let mimeType = 'audio/webm;codecs=opus';
          if (!MediaRecorder.isTypeSupported(mimeType)) {
            mimeType = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : '';
          }

          mediaRecorder = new MediaRecorder(audioStream, mimeType ? { mimeType } : undefined);
          
          // Convert Blob -> ArrayBuffer to prevent binary socket corruption on the server
          mediaRecorder.ondataavailable = async (e) => {
            if (e.data.size > 0 && ws && ws.readyState === WebSocket.OPEN) {
              const buffer = await e.data.arrayBuffer();
              ws.send(buffer);
            }
          };

          mediaRecorder.start(250);
          startBtn.disabled = true;
          stopBtn.disabled = false;

          startLocalCountdown();
          if (currentUser) startUsageSyncing(currentUser.id, room);
        };

        ws.onerror = (err) => {
          console.error("WebSocket Error:", err);
          status.innerText = "Status: Connection Error";
          status.style.color = "#ef4444";
        };

        ws.onclose = (e) => {
          if (status.innerText !== "Status: Terminated — Maximum Time Limit Reached") {
            status.innerText = e.reason ? `Status: Closed (${e.reason})` : "Status: Disconnected";
            status.style.color = "#ef4444";
          }
          cleanup();
        };

      } catch (err) {
        console.error("Microphone Access Error:", err);
        status.innerText = "Status: Microphone Access Denied";
        status.style.color = "#ef4444";
      }
    };

    stopBtn.onclick = () => {
      cleanup();
      status.innerText = "Status: Stopped";
      status.style.color = "#9ca3af";
    };

    function cleanup() {
      stopUsageSyncing();
      stopLocalCountdown();

      if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
      if (audioStream) audioStream.getTracks().forEach(track => track.stop());
      if (ws && ws.readyState === WebSocket.OPEN) ws.close();

      startBtn.disabled = currentRemainingSeconds <= 0;
      stopBtn.disabled = true;
    }

    window.addEventListener('beforeunload', () => {
      if (realtimeChannel) supabaseClient.removeChannel(realtimeChannel);
      cleanup();
    });
  </script>
</body>
</html>
