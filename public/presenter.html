<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Presenter Audio Ingest - AICaptions</title>

  <!-- Supabase JS Client SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #111827;
      color: #f3f4f6;
      padding: 2rem;
      text-align: center;
      margin: 0;
    }
    .card {
      max-width: 550px;
      margin: 2rem auto;
      background: #1f2937;
      padding: 2rem;
      border-radius: 12px;
      border: 1px solid #374151;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
    }
    h1 { margin-top: 0; color: #60a5fa; font-size: 1.75rem; }
    p { color: #9ca3af; }
    .room-badge {
      display: inline-block;
      background: #374151;
      color: #93c5fd;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-family: monospace;
      font-weight: bold;
      margin-bottom: 1rem;
    }
    .timer-badge {
      display: block;
      background: #111827;
      border: 1px solid #374151;
      color: #38bdf8;
      font-size: 1.25rem;
      font-weight: 700;
      font-family: monospace;
      padding: 0.6rem 1rem;
      border-radius: 8px;
      margin: 1rem 0;
    }
    
    /* Dropdown Styling */
    .setting-group {
      margin-top: 1rem; 
      text-align: left;
    }
    .setting-label {
      display: block; 
      font-size: 0.85rem; 
      color: #9ca3af; 
      margin-bottom: 0.5rem; 
      font-weight: 600;
    }
    select {
      width: 100%; 
      padding: 0.6rem 0.8rem; 
      background-color: #111827; 
      color: #f3f4f6; 
      border: 1px solid #374151; 
      border-radius: 8px; 
      font-size: 0.95rem; 
      outline: none; 
      cursor: pointer;
    }

    /* Output Language Tabs Styling */
    .language-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .tab-btn {
      background: #111827;
      color: #9ca3af;
      border: 1px solid #374151;
      padding: 0.6rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      flex: 1 1 calc(33.333% - 0.5rem);
      transition: all 0.2s ease-in-out;
    }
    .tab-btn:hover {
      background: #374151;
      color: #f3f4f6;
    }
    .tab-btn.active {
      background: #2563eb;
      color: white;
      border-color: #3b82f6;
    }

    /* Action Buttons */
    .btn-group {
      display: flex;
      gap: 1rem;
      justify-content: center;
      margin-top: 2rem;
    }
    .action-btn {
      padding: 0.85rem 1.75rem;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    #startBtn { background: #2563eb; color: white; }
    #startBtn:hover { background: #1d4ed8; }
    #startBtn:disabled { background: #4b5563; cursor: not-allowed; }
    #stopBtn { background: #dc2626; color: white; }
    #stopBtn:hover { background: #b91c1c; }
    #stopBtn:disabled { background: #4b5563; cursor: not-allowed; }
    #status {
      margin-top: 1.5rem;
      font-weight: 600;
      font-size: 1.1rem;
      color: #9ca3af;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Stage Audio Transmitter</h1>
    <p>Room Identifier:</p>
    <div class="room-badge" id="roomDisplay">main-stage</div>

    <div class="timer-badge" id="timerDisplay">Remaining Time: --:--</div>

    <!-- Spoken Language (Dropdown) -->
    <div class="setting-group">
      <label class="setting-label" for="languageSelect">Spoken Language</label>
      <select id="languageSelect">
        <!-- Populated dynamically by JS -->
      </select>
    </div>

    <!-- Output Translation (Tabbed UI) -->
    <div class="setting-group" style="margin-top: 1.5rem;">
      <label class="setting-label">Overlay Output Translation</label>
      <div class="language-tabs" id="translationTabs">
        <!-- The data-lang attributes dictate what is sent to the backend/overlay -->
        <button class="tab-btn active" data-lang="none">No Translation</button>
        <button class="tab-btn" data-lang="es-ES">Spanish</button>
        <button class="tab-btn" data-lang="fr-FR">French</button>
        <button class="tab-btn" data-lang="de-DE">German</button>
        <button class="tab-btn" data-lang="zh-CN">Chinese</button>
        <button class="tab-btn" data-lang="ja-JP">Japanese</button>
      </div>
    </div>

    <div class="btn-group">
      <button class="action-btn" id="startBtn">Start Streaming</button>
      <button class="action-btn" id="stopBtn" disabled>Stop</button>
    </div>

    <p id="status">Status: Disconnected</p>
  </div>

  <script>
    // 1. Supabase Initialization
    const SUPABASE_URL = 'https://euopdmwtowuxdzczwbul.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_UQHJUuyX1-nHwpJ6ilgD7g_BZ0vNUWB';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // State Variables
    let currentUser = null;
    let syncTimer = null;
    let localCountdownTimer = null;
    let realtimeChannel = null;
    let roomBroadcastChannel = null;
    const UPDATE_INTERVAL_SECONDS = 5;
    let maxLimit = 3600; 
    let currentRemainingSeconds = 0;
    
    // Global variable for the selected output tab
    let currentTargetLang = localStorage.getItem('target_lang') || 'none';

    // Authenticate Presenter Session
    async function initPresenterAuth() {
      try {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (session && session.user) {
          currentUser = session.user;
          await fetchUserTimeAndSubscribe(currentUser.id);
        }
      } catch (err) {
        console.warn("Could not retrieve Supabase session:", err.message);
      }
    }

    // Timer & Syncing Logic
    async function fetchUserTimeAndSubscribe(userId) {
      if (!userId) return;
      try {
        const { data: user, error } = await supabaseClient
          .from('users')
          .select('streaming_seconds_used, max_streaming_seconds')
          .eq('user_id', userId)
          .single();

        if (!error && user) {
          applyTimeLimits(user.streaming_seconds_used || 0, user.max_streaming_seconds ?? maxLimit);
        }
        subscribeToRealtimeUsage(userId);
      } catch (e) {
        console.warn("Initial user state fetch error:", e.message);
      }
    }

    function subscribeToRealtimeUsage(userId) {
      if (realtimeChannel) supabaseClient.removeChannel(realtimeChannel);
      realtimeChannel = supabaseClient
        .channel(`presenter_time_${userId}`)
        .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'users', filter: `user_id=eq.${userId}` },
          (payload) => {
            if (payload.new) {
              applyTimeLimits(payload.new.streaming_seconds_used || 0, payload.new.max_streaming_seconds ?? maxLimit);
            }
          }
        )
        .subscribe();
    }

    function applyTimeLimits(usedSecs, allowedMaxSecs) {
      currentRemainingSeconds = Math.max(0, allowedMaxSecs - usedSecs);
      updateTimerDisplay(currentRemainingSeconds);

      if (currentRemainingSeconds <= 0) {
        if (isStreamingActive()) {
          cleanup();
          status.innerText = "Status: Terminated — Maximum Time Limit Reached";
          status.style.color = "#ef4444";
          alert(`Stream stopped: You have reached your maximum streaming limit.`);
        } else {
          status.innerText = `Status: Time Limit Exceeded`;
          status.style.color = "#ef4444";
          startBtn.disabled = true;
        }
      }
    }

    function updateTimerDisplay(totalSeconds) {
      const timerDisplay = document.getElementById('timerDisplay');
      if (!timerDisplay) return;
      const mins = Math.floor(totalSeconds / 60);
      const secs = totalSeconds % 60;
      timerDisplay.innerText = `Remaining Time: ${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      
      if (totalSeconds <= 60) timerDisplay.style.color = '#ef4444';
      else if (totalSeconds <= 300) timerDisplay.style.color = '#f59e0b';
      else timerDisplay.style.color = '#38bdf8';
    }

    function startLocalCountdown() {
      stopLocalCountdown();
      localCountdownTimer = setInterval(() => {
        if (currentRemainingSeconds > 0) {
          currentRemainingSeconds--;
          updateTimerDisplay(currentRemainingSeconds);
          if (currentRemainingSeconds <= 0) {
            cleanup();
            status.innerText = "Status: Terminated — Maximum Time Limit Reached";
            status.style.color = "#ef4444";
          }
        }
      }, 1000);
    }

    function stopLocalCountdown() {
      if (localCountdownTimer) {
        clearInterval(localCountdownTimer);
        localCountdownTimer = null;
      }
    }

    function startUsageSyncing(userId, roomId) {
      stopUsageSyncing();
      syncTimer = setInterval(async () => {
        await pushUsageToSupabase(userId, roomId, UPDATE_INTERVAL_SECONDS);
      }, UPDATE_INTERVAL_SECONDS * 1000);
    }

    async function pushUsageToSupabase(userId, roomId, secondsToAdd) {
      if (!userId) return;
      try {
        const { data: user } = await supabaseClient
          .from('users')
          .select('streaming_seconds_used, max_streaming_seconds')
          .eq('user_id', userId)
          .();

        if (!user) return;

        const currentUsed = user.streaming_seconds_used || 0;
        const allowedMax = user.max_streaming_seconds ?? maxLimit;
        const newTotal = currentUsed + secondsToAdd;

        if (newTotal >= allowedMax) {
          await supabaseClient.from('users').update({ streaming_seconds_used: allowedMax }).eq('user_id', userId);
          cleanup();
          return;
        }

        await supabaseClient.from('users').update({ streaming_seconds_used: newTotal }).eq('user_id', userId);

        if (roomId) {
          const { data: room } = await supabaseClient.from('rooms').select('streaming_seconds_used').eq('room_id', roomId).single();
          if (room) {
            await supabaseClient.from('rooms').update({ streaming_seconds_used: (room.streaming_seconds_used || 0) + secondsToAdd }).eq('room_id', roomId);
          }
        }
      } catch (err) {
        console.warn("Usage sync error:", err.message);
      }
    }

    function stopUsageSyncing() {
      if (syncTimer) { clearInterval(syncTimer); syncTimer = null; }
    }

    function isStreamingActive() {
      return mediaRecorder && mediaRecorder.state !== 'inactive';
    }

    // Core Languages for the Spoken Language Dropdown
    const SPOKEN_LANGUAGES = [
      { code: 'en-US', name: 'English (United States)' },
      { code: 'en-AU', name: 'English (Australia)' },
      { code: 'en-GB', name: 'English (United Kingdom)' },
      { code: 'es-ES', name: 'Spanish (Spain)' },
      { code: 'fr-FR', name: 'French (France)' },
      { code: 'de-DE', name: 'German' },
      { code: 'zh-CN', name: 'Chinese (Simplified)' },
      { code: 'ja-JP', name: 'Japanese' },
      { code: 'it-IT', name: 'Italian' },
      { code: 'pt-BR', name: 'Portuguese' }
    ];

    const urlParams = new URLSearchParams(window.location.search);
    const room = urlParams.get('room') || urlParams.get('roomId') || 'main-stage';
    const parsedMaxLimit = parseInt(urlParams.get('maxLimit'), 10);
    if (!isNaN(parsedMaxLimit) && parsedMaxLimit > 0) maxLimit = parsedMaxLimit;

    async function broadcastTargetLanguage(targetLang) {
      try {
        if (!roomBroadcastChannel) {
          roomBroadcastChannel = supabaseClient.channel(`room_${room}`);
          await roomBroadcastChannel.subscribe();
        }
        roomBroadcastChannel.send({
          type: 'broadcast',
          event: 'target_lang_change',
          payload: { targetLang, room }
        });
      } catch (err) {
        console.warn("Could not broadcast target language change:", err.message);
      }
    }

    function initSettings(defaultSpoken = 'en-US') {
      // 1. Init Spoken Language Dropdown
      const selectSpoken = document.getElementById('languageSelect');
      SPOKEN_LANGUAGES.forEach((lang) => {
        const opt = document.createElement('option');
        opt.value = lang.code;
        opt.textContent = lang.name;
        if (lang.code === defaultSpoken) opt.selected = true;
        selectSpoken.appendChild(opt);
      });
      selectSpoken.addEventListener('change', (e) => localStorage.setItem('presenter_lang', e.target.value));

      // 2. Init Tabbed Output Translation UI
      const tabs = document.querySelectorAll('.tab-btn');
      tabs.forEach(tab => {
        // Set initial active state based on localStorage
        if (tab.dataset.lang === currentTargetLang) {
          tabs.forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
        }

        tab.addEventListener('click', (e) => {
          tabs.forEach(t => t.classList.remove('active'));
          e.target.classList.add('active');
          
          currentTargetLang = e.target.dataset.lang;
          localStorage.setItem('target_lang', currentTargetLang);

          // If WS is running, update the server config on the fly
          if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ type: 'config', targetLang: currentTargetLang }));
          }

          // Broadcast to connected overlays
          broadcastTargetLanguage(currentTargetLang);
        });
      });
    }
    
    const token = urlParams.get('token') || (localStorage.getItem('supabase.auth.token') ? JSON.parse(localStorage.getItem('supabase.auth.token'))?.currentSession?.access_token : '');

    document.getElementById('roomDisplay').innerText = room;
    initSettings(localStorage.getItem('presenter_lang') || 'en-US');
    initPresenterAuth();

    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const status = document.getElementById('status');

    let ws = null;
    let mediaRecorder = null;
    let audioStream = null;

    startBtn.onclick = async () => {
      if (currentRemainingSeconds <= 0) {
        alert("Cannot start streaming: Your maximum allowed streaming time has been reached.");
        return;
      }

      try {
        status.innerText = "Status: Requesting Microphone Access...";
        status.style.color = "#f59e0b";

        audioStream = await navigator.mediaDevices.getUserMedia({ 
          audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } 
        });

        const selectedSpokenLang = document.getElementById('languageSelect').value;
        const protocol = location.protocol === "https:" ? "wss:" : "ws:";
        
        // Pass both spoken language and the active tab's target language in the connection string
        let wsUrl = `${protocol}//${location.host}?room=${encodeURIComponent(room)}&role=presenter&lang=${encodeURIComponent(selectedSpokenLang)}&target_lang=${encodeURIComponent(currentTargetLang)}`;
        if (token) wsUrl += `&token=${encodeURIComponent(token)}`;

        ws = new WebSocket(wsUrl);

        ws.onopen = () => {
          status.innerText = "Status: Live & Streaming Stage Audio";
          status.style.color = "#10b981";

          let mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus' : (MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : '');
          mediaRecorder = new MediaRecorder(audioStream, mimeType ? { mimeType } : undefined);

          mediaRecorder.ondataavailable = (e) => {
            if (e.data.size > 0 && ws && ws.readyState === WebSocket.OPEN) {
              ws.send(e.data);
            }
          };

          mediaRecorder.start(250);
          startBtn.disabled = true;
          stopBtn.disabled = false;

          broadcastTargetLanguage(currentTargetLang);
          startLocalCountdown();
          if (currentUser) startUsageSyncing(currentUser.id, room);
        };

        ws.onerror = () => {
          status.innerText = "Status: Connection Error";
          status.style.color = "#ef4444";
        };

        ws.onclose = (e) => {
          if (status.innerText !== "Status: Terminated — Maximum Time Limit Reached") {
            status.innerText = e.reason ? `Status: Closed (${e.reason})` : "Status: Disconnected";
            status.style.color = "#ef4444";
          }
          cleanup();
        };

      } catch (err) {
        console.error("Microphone Access Error:", err);
        status.innerText = "Status: Microphone Access Denied";
        status.style.color = "#ef4444";
      }
    };

    stopBtn.onclick = () => {
      cleanup();
      status.innerText = "Status: Stopped";
      status.style.color = "#9ca3af";
    };

    function cleanup() {
      stopUsageSyncing();
      stopLocalCountdown();
      if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
      if (audioStream) audioStream.getTracks().forEach(track => track.stop());
      if (ws && ws.readyState === WebSocket.OPEN) ws.close();
      startBtn.disabled = currentRemainingSeconds <= 0;
      stopBtn.disabled = true;
    }

    window.addEventListener('beforeunload', () => {
      if (realtimeChannel) supabaseClient.removeChannel(realtimeChannel);
      if (roomBroadcastChannel) supabaseClient.removeChannel(roomBroadcastChannel);
      cleanup();
    });
  </script>
</body>
</html>
