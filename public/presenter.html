<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Presenter Console - AICaptions</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    .card { background-color: #1e293b; border: 1px solid #334155; border-radius: 0.75rem; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">

  <div class="card w-full max-w-xl p-8 space-y-6 shadow-2xl">
    
    <!-- Header -->
    <div class="flex justify-between items-center border-b border-slate-700/60 pb-4">
      <div>
        <h1 class="text-xl font-bold text-white flex items-center gap-2">
          <span>🎙️</span> Presenter Studio
        </h1>
        <p id="room-display" class="text-xs text-slate-400 mt-1">Room ID: connecting...</p>
      </div>
      <div id="status-badge" class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-slate-800 border border-slate-700 text-xs font-semibold text-slate-400">
        <span id="status-dot" class="w-2.5 h-2.5 rounded-full bg-slate-500"></span>
        <span id="status-text">OFFLINE</span>
      </div>
    </div>

    <!-- Controls -->
    <div class="space-y-4">
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Target Language</label>
        <select id="lang-select" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500">
          <option value="en-US">English (US)</option>
          <option value="en-GB">English (UK)</option>
          <option value="es">Spanish</option>
          <option value="fr">French</option>
          <option value="de">German</option>
          <option value="it">Italian</option>
          <option value="pt">Portuguese</option>
          <option value="ja">Japanese</option>
        </select>
      </div>

      <button id="toggle-stream-btn" class="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-lg text-sm transition shadow-lg shadow-blue-600/20">
        Start Streaming
      </button>
    </div>

    <!-- Live Preview Box -->
    <div class="space-y-2">
      <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400">Live Local Preview</label>
      <div id="transcript-box" class="w-full h-36 bg-slate-900/80 border border-slate-800 rounded-lg p-4 text-sm text-slate-300 overflow-y-auto font-mono">
        Click "Start Streaming" and begin speaking...
      </div>
    </div>

  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const roomId = urlParams.get('roomId') || urlParams.get('room') || 'main-stage';
    const token = urlParams.get('token');

    document.getElementById('room-display').innerText = `Room ID: ${roomId}`;

    // If token is missing, notify the user or redirect back to login
    if (!token) {
      alert("Authentication session missing. Please log in through the dashboard first.");
      window.location.href = "/login.html";
    }

    let ws = null;
    let mediaRecorder = null;
    let audioStream = null;
    let isStreaming = false;

    const toggleBtn = document.getElementById('toggle-stream-btn');
    const statusDot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');
    const transcriptBox = document.getElementById('transcript-box');
    const langSelect = document.getElementById('lang-select');

    function setStatus(status, text) {
      statusText.innerText = text;
      statusDot.className = `w-2.5 h-2.5 rounded-full ${status}`;
    }

    toggleBtn.addEventListener('click', async () => {
      if (!isStreaming) {
        await startStreaming();
      } else {
        stopStreaming();
      }
    });

    async function startStreaming() {
      const lang = langSelect.value;
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${protocol}//${window.location.host}?roomId=${encodeURIComponent(roomId)}&role=presenter&lang=${lang}&token=${encodeURIComponent(token)}`;

      try {
        // 1. Request microphone access
        audioStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });

        // 2. Connect to WebSocket server with Token
        ws = new WebSocket(wsUrl);
        ws.binaryType = 'arraybuffer';

        ws.onopen = () => {
          console.log("WebSocket Connected");
          setStatus("bg-emerald-500 animate-pulse", "LIVE");
          toggleBtn.innerText = "Stop Streaming";
          toggleBtn.className = "w-full py-3 bg-red-600 hover:bg-red-500 text-white font-bold rounded-lg text-sm transition shadow-lg shadow-red-600/20";
          langSelect.disabled = true;
          isStreaming = true;
          transcriptBox.innerHTML = "";

          // 3. Set up MediaRecorder for chunks
          mediaRecorder = new MediaRecorder(audioStream, { mimeType: 'audio/webm;codecs=opus' });
          
          mediaRecorder.ondataavailable = (event) => {
            if (event.data.size > 0 && ws && ws.readyState === WebSocket.OPEN) {
              ws.send(event.data);
            }
          };

          // Send data chunks every 250ms
          mediaRecorder.start(250);
        };

        ws.onmessage = (event) => {
          try {
            const data = JSON.parse(event.data);
            if (data.type === 'caption' && data.text) {
              if (data.isFinal) {
                transcriptBox.innerHTML += `<div class="mb-1 text-white">${data.text}</div>`;
              } else {
                // Show interim result preview
                let interimDiv = document.getElementById('interim-caption');
                if (!interimDiv) {
                  interimDiv = document.createElement('div');
                  interimDiv.id = 'interim-caption';
                  interimDiv.className = 'text-slate-500 italic mb-1';
                  transcriptBox.appendChild(interimDiv);
                }
                interimDiv.innerText = data.text;
              }
              transcriptBox.scrollTop = transcriptBox.scrollHeight;
            } else if (data.error) {
              alert("Stream Error: " + data.error);
              stopStreaming();
            }
          } catch (e) {
            console.error("Message parse error:", e);
          }
        };

        ws.onerror = (err) => {
          console.error("WebSocket error:", err);
          setStatus("bg-amber-500", "ERROR");
        };

        ws.onclose = (event) => {
          console.log("WebSocket closed:", event);
          if (event.code === 4003) {
            alert("Authorization failed or session expired. Please re-authenticate from the dashboard.");
          }
          stopStreaming();
        };

      } catch (err) {
        console.error("Failed to start audio stream:", err);
        alert("Microphone permission denied or unsupported audio configuration.");
        stopStreaming();
      }
    }

    function stopStreaming() {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
      }
      if (audioStream) {
        audioStream.getTracks().forEach(track => track.stop());
      }
      if (ws) {
        ws.close();
      }

      isStreaming = false;
      setStatus("bg-slate-500", "OFFLINE");
      toggleBtn.innerText = "Start Streaming";
      toggleBtn.className = "w-full py-3 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-lg text-sm transition shadow-lg shadow-blue-600/20";
      langSelect.disabled = false;
    }
  </script>
</body>
</html>
