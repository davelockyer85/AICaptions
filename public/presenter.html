<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Presenter Audio Ingest - AICaptions</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--screen-bg, #111827);
      color: #f3f4f6;
      padding: 2rem;
      text-align: center;
      margin: 0;
      transition: background-color 0.3s ease;
    }
    .card {
      max-width: 600px;
      margin: 2rem auto;
      background: #1f2937;
      padding: 2rem;
      border-radius: 12px;
      border: 1px solid #374151;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
      text-align: left;
    }
    h1 {
      margin-top: 0;
      color: #60a5fa;
      font-size: 1.75rem;
      text-align: center;
    }
    .control-group {
      margin-bottom: 1rem;
    }
    .control-group label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      margin-bottom: 0.5rem;
      color: #9ca3af;
    }
    .control-group select {
      width: 100%;
      padding: 10px 12px;
      background-color: #111827;
      border: 1px solid #374151;
      border-radius: 6px;
      color: #f3f4f6;
      font-size: 0.95rem;
    }
    .preview-box {
      background: rgba(0, 0, 0, 0.4);
      border: 1px dashed #374151;
      border-radius: 8px;
      padding: 24px;
      text-align: center;
      margin: 1.5rem 0;
    }
    #previewSubtitle {
      display: inline-block;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 24px;
      font-weight: 700;
      color: #ffffff;
      transition: all 0.2s ease;
    }
    .btn {
      background-color: #3b82f6;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      margin-top: 1rem;
    }
    .btn:hover {
      background-color: #2563eb;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Presenter Control & Audio Ingest</h1>
    
    <div style="margin-top: 1.5rem; border-top: 1px solid #374151; padding-top: 1.5rem;">
      <h2 style="font-size: 1.1rem; color: #f3f4f6; margin-bottom: 1rem;">Customization Settings</h2>

      <!-- Screen Background Setting (Transparent vs Green Screen) -->
      <div class="control-group">
        <label for="screenBgSelect">Screen Background</label>
        <select id="screenBgSelect" onchange="updateScreenBackground()">
          <option value="#111827">Dark Default (#111827)</option>
          <option value="transparent">Transparent</option>
          <option value="#00ff00">Green Screen (#00ff00)</option>
          <option value="#00b140">Chroma Green (#00b140)</option>
        </select>
      </div>

      <!-- Caption Background Setting (On / Off / Shadow) -->
      <div class="control-group">
        <label for="captionBgSelect">Caption Background Style</label>
        <select id="captionBgSelect" onchange="updateCaptionStyle()">
          <option value="on">On (Semi-Transparent Box)</option>
          <option value="off">Off (Transparent Box)</option>
          <option value="shadow">Shadow Effect (Text Shadow, No Box)</option>
        </select>
      </div>

      <!-- Live Preview Box -->
      <div class="preview-box" id="previewContainer">
        <div id="previewSubtitle">Sample caption preview rendering here...</div>
      </div>

      <button class="btn" onclick="saveAndBroadcastStyles()">Apply & Sync Styles</button>
    </div>

    <!-- Existing Presenter Controls / Audio Ingest UI -->
    <div style="margin-top: 2rem; text-align: center;">
      <button id="startBtn" class="btn" style="background-color: #10b981;">Start Captions</button>
      <button id="stopBtn" class="btn" style="background-color: #ef4444;" disabled>Stop Captions</button>
      <div id="status" style="margin-top: 1rem; color: #9ca3af;">Status: Ready</div>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const roomId = urlParams.get('room') || 'main-stage';

    const previewSubtitle = document.getElementById('previewSubtitle');
    const previewContainer = document.getElementById('previewContainer');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const status = document.getElementById('status');

    let ws = null;
    let mediaRecorder = null;
    let audioStream = null;

    function updateScreenBackground() {
      const bgVal = document.getElementById('screenBgSelect').value;
      if (bgVal === 'transparent') {
        document.body.style.backgroundColor = 'transparent';
        previewContainer.style.backgroundColor = 'rgba(255,255,255,0.05)';
      } else {
        document.body.style.backgroundColor = bgVal;
        previewContainer.style.backgroundColor = 'rgba(0,0,0,0.4)';
      }
    }

    function updateCaptionStyle() {
      const styleVal = document.getElementById('captionBgSelect').value;
      
      if (styleVal === 'on') {
        previewSubtitle.style.background = 'rgba(0, 0, 0, 0.75)';
        previewSubtitle.style.textShadow = 'none';
      } else if (styleVal === 'off') {
        previewSubtitle.style.background = 'transparent';
        previewSubtitle.style.textShadow = 'none';
      } else if (styleVal === 'shadow') {
        previewSubtitle.style.background = 'transparent';
        previewSubtitle.style.textShadow = '2px 2px 6px rgba(0, 0, 0, 0.95), -2px -2px 6px rgba(0, 0, 0, 0.95), 0 0 12px rgba(0, 0, 0, 0.9)';
      }
    }

    function saveAndBroadcastStyles() {
      const settings = {
        screenBg: document.getElementById('screenBgSelect').value,
        captionStyle: document.getElementById('captionBgSelect').value
      };

      localStorage.setItem(`aicaptions_presenter_styles_${roomId}`, JSON.stringify(settings));

      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'styles_update', styles: settings }));
      }

      alert('Style settings saved and synced!');
    }

    window.addEventListener('DOMContentLoaded', () => {
      const saved = localStorage.getItem(`aicaptions_presenter_styles_${roomId}`);
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          if (parsed.screenBg) {
            document.getElementById('screenBgSelect').value = parsed.screenBg;
            updateScreenBackground();
          }
          if (parsed.captionStyle) {
            document.getElementById('captionBgSelect').value = parsed.captionStyle;
            updateCaptionStyle();
          }
        } catch (e) {
          console.error("Error loading saved style preferences", e);
        }
      }
    });

    startBtn.onclick = async () => {
      try {
        status.innerText = "Status: Requesting Microphone...";
        status.style.color = "#f59e0b";
        audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        
        const wsProtocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
        ws = new WebSocket(`${wsProtocol}${window.location.host}/ws/presenter?room=${encodeURIComponent(roomId)}`);

        ws.onopen = () => {
          status.innerText = "Status: Connected & Streaming";
          status.style.color = "#10b981";
        };

        mediaRecorder = new MediaRecorder(audioStream, { mimeType: 'audio/webm' });
        mediaRecorder.ondataavailable = (e) => {
          if (e.data.size > 0 && ws && ws.readyState === WebSocket.OPEN) {
            ws.send(e.data);
          }
        };
        mediaRecorder.start(250);
        startBtn.disabled = true;
        stopBtn.disabled = false;
      } catch (err) {
        console.error("Microphone Access Error:", err);
        status.innerText = "Status: Microphone Access Denied";
        status.style.color = "#ef4444";
      }
    };

    stopBtn.onclick = () => {
      cleanup();
      status.innerText = "Status: Stopped";
      status.style.color = "#9ca3af";
    };

    function cleanup() {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
      }
      if (audioStream) {
        audioStream.getTracks().forEach(track => track.stop());
      }
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.close();
      }
      startBtn.disabled = false;
      stopBtn.disabled = true;
    }
  </script>
</body>
</html>
