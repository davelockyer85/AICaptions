<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Presenter Audio Ingest - AICaptions</title>
  <!-- Supabase JS Client SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #111827;
      color: #f3f4f6;
      padding: 2rem;
      text-align: center;
      margin: 0;
    }
    .card {
      max-width: 600px;
      margin: 2rem auto;
      background: #1f2937;
      padding: 2rem;
      border-radius: 12px;
      border: 1px solid #374151;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
    }
    h1 {
      margin-top: 0;
      color: #60a5fa;
      font-size: 1.75rem;
    }
    p {
      color: #9ca3af;
    }
    .room-badge {
      display: inline-block;
      background: #374151;
      color: #93c5fd;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-family: monospace;
      font-weight: bold;
      margin-bottom: 1rem;
    }
    .timer-badge {
      display: block;
      background: #111827;
      border: 1px solid #374151;
      color: #38bdf8;
      font-size: 1.25rem;
      font-weight: 700;
      font-family: monospace;
      padding: 0.6rem 1rem;
      border-radius: 8px;
      margin: 1rem 0;
    }
    .setting-group {
      margin-top: 1rem;
      text-align: left;
    }
    label {
      display: block;
      font-size: 0.85rem;
      color: #9ca3af;
      margin-bottom: 0.5rem;
      font-weight: 600;
    }
    select, input[type="range"] {
      width: 100%;
      padding: 0.6rem 0.8rem;
      background-color: #111827;
      color: #f3f4f6;
      border: 1px solid #374151;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      cursor: pointer;
    }
    /* 5-Language Target Output Tabs */
    .lang-tabs {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }
    .lang-tab {
      flex: 1;
      padding: 0.5rem;
      background: #111827;
      border: 1px solid #374151;
      color: #9ca3af;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .lang-tab:hover {
      border-color: #60a5fa;
      color: #f3f4f6;
    }
    .lang-tab.active {
      background: #2563eb;
      color: #ffffff;
      border-color: #3b82f6;
    }
    .btn-group {
      display: flex;
      gap: 1rem;
      justify-content: center;
      margin-top: 1.5rem;
    }
    button.action-btn {
      padding: 0.85rem 1.75rem;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    #startBtn { background: #2563eb; color: white; }
    #startBtn:hover { background: #1d4ed8; }
    #startBtn:disabled { background: #4b5563; cursor: not-allowed; }
    #stopBtn { background: #dc2626; color: white; }
    #stopBtn:hover { background: #b91c1c; }
    #stopBtn:disabled { background: #4b5563; cursor: not-allowed; }
    #status {
      margin-top: 1.5rem;
      font-weight: 600;
      font-size: 1.1rem;
      color: #9ca3af;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Stage Audio Transmitter</h1>
    <p>Room Identifier:</p>
    <div class="room-badge" id="roomDisplay">main-stage</div>

    <!-- Real-Time Countdown Timer -->
    <div class="timer-badge" id="timerDisplay">Remaining Time: --:--</div>

    <!-- Spoken / Ingest Language Selector -->
    <div class="setting-group">
      <label for="languageSelect">Spoken Input Language</label>
      <select id="languageSelect">
        <!-- Populated dynamically by JS -->
      </select>
    </div>

    <!-- 5 Output Language Target Tabs (Overlay & Broadcast) -->
    <div class="setting-group">
      <label>Caption Output Language (Overlay & Viewers)</label>
      <div class="lang-tabs" id="outputLangTabs">
        <button class="lang-tab active" data-lang="en">English</button>
        <button class="lang-tab" data-lang="es">Español</button>
        <button class="lang-tab" data-lang="fr">Français</button>
        <button class="lang-tab" data-lang="de">Deutsch</button>
        <button class="lang-tab" data-lang="zh">中文</button>
      </div>
    </div>

    <!-- Overlay Style Controls -->
    <div class="setting-group" style="background: #111827; padding: 1rem; border-radius: 8px; border: 1px solid #374151;">
      <label style="color: #60a5fa; margin-bottom: 0.75rem;">Overlay Style Controls</label>
      
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-bottom: 0.75rem;">
        <div>
          <label style="font-size: 0.75rem;">Font Size (<span id="fontSizeVal">32</span>px)</label>
          <input type="range" id="fontSizeInput" min="16" max="96" value="32" oninput="document.getElementById('fontSizeVal').innerText = this.value" onchange="updateStyles()">
        </div>
        <div>
          <label style="font-size: 0.75rem;">Font Family</label>
          <select id="fontFamilyInput" onchange="updateStyles()">
            <option value="sans-serif">Sans-Serif</option>
            <option value="serif">Serif</option>
            <option value="monospace">Monospace</option>
            <option value="'Bungee', cursive">Bungee</option>
          </select>
        </div>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-bottom: 0.75rem;">
        <div>
          <label style="font-size: 0.75rem;">Animation</label>
          <select id="animationInput" onchange="updateStyles()">
            <option value="none">None</option>
            <option value="bounce">Bounce</option>
            <option value="fade">Fade In</option>
          </select>
        </div>
        <div>
          <label style="font-size: 0.75rem;">Text Color</label>
          <input type="color" id="textColorInput" value="#ffffff" onchange="updateStyles()" style="width: 100%; height: 38px; background: #111827; border: 1px solid #374151; border-radius: 6px; cursor: pointer; padding: 0;">
        </div>
      </div>

      <div style="display: flex; gap: 1.5rem; justify-content: center; margin-top: 0.5rem;">
        <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer; font-size: 0.85rem; color: #f3f4f6;">
          <input type="checkbox" id="boldInput" onchange="updateStyles()"> Bold
        </label>
        <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer; font-size: 0.85rem; color: #f3f4f6;">
          <input type="checkbox" id="italicInput" onchange="updateStyles()"> Italic
        </label>
      </div>
    </div>

    <div class="btn-group">
      <button id="startBtn" class="action-btn">Start Streaming</button>
      <button id="stopBtn" class="action-btn" disabled>Stop</button>
    </div>

    <p id="status">Status: Disconnected</p>
  </div>

  <script>
    // 1. Supabase Initialization
    const SUPABASE_URL = 'https://euopdmwtowuxdzczwbul.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_UQHJUuyX1-nHwpJ6ilgD7g_BZ0vNUWB';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // State Variables for Live Usage Tracking & Output Language
    let currentUser = null;
    let syncTimer = null;
    let localCountdownTimer = null;
    let realtimeChannel = null;
    const UPDATE_INTERVAL_SECONDS = 5;
    let maxLimit = 3600; // Default fallback (1 hour)
    let currentRemainingSeconds = 0;
    let targetOutputLang = 'en';

    // Authenticate Presenter Session
    async function initPresenterAuth() {
      try {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (session && session.user) {
          currentUser = session.user;
          await fetchUserTimeAndSubscribe(currentUser.id);
        }
      } catch (err) {
        console.warn("Could not retrieve Supabase session:", err.message);
      }
    }

    async function fetchUserTimeAndSubscribe(userId) {
      if (!userId) return;
      try {
        const { data: user, error } = await supabaseClient
          .from('users')
          .select('streaming_seconds_used, max_streaming_seconds')
          .eq('user_id', userId)
          .maybeSingle();

        if (!error && user) {
          applyTimeLimits(user.streaming_seconds_used || 0, user.max_streaming_seconds ?? maxLimit);
        }
        subscribeToRealtimeUsage(userId);
      } catch (e) {
        console.warn("Initial user state fetch error:", e.message);
      }
    }

    function subscribeToRealtimeUsage(userId) {
      if (realtimeChannel) supabaseClient.removeChannel(realtimeChannel);
      realtimeChannel = supabaseClient
        .channel(`presenter_time_${userId}`)
        .on('postgres_changes', {
          event: 'UPDATE',
          schema: 'public',
          table: 'users',
          filter: `user_id=eq.${userId}`
        }, (payload) => {
          if (payload.new) {
            const used = payload.new.streaming_seconds_used || 0;
            const maxSecs = payload.new.max_streaming_seconds ?? maxLimit;
            applyTimeLimits(used, maxSecs);
          }
        })
        .subscribe((status, err) => {
          if (status === 'CHANNEL_ERROR') {
            console.warn("Realtime subscription error:", err);
          }
        });
    }

    function applyTimeLimits(usedSecs, allowedMaxSecs) {
      currentRemainingSeconds = Math.max(0, allowedMaxSecs - usedSecs);
      updateTimerDisplay(currentRemainingSeconds);

      if (currentRemainingSeconds <= 0) {
        if (isStreamingActive()) {
          cleanup();
          status.innerText = "Status: Terminated — Maximum Time Limit Reached";
          status.style.color = "#ef4444";
          alert(`Stream stopped: You have reached your maximum streaming limit.`);
        } else {
          status.innerText = `Status: Time Limit Exceeded (${Math.floor(usedSecs/60)}/${Math.floor(allowedMaxSecs/60)} mins)`;
          status.style.color = "#ef4444";
          startBtn.disabled = true;
        }
      }
    }

    function updateTimerDisplay(totalSeconds) {
      const timerDisplay = document.getElementById('timerDisplay');
      if (!timerDisplay) return;
      const mins = Math.floor(totalSeconds / 60);
      const secs = totalSeconds % 60;
      const formatted = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      timerDisplay.innerText = `Remaining Time: ${formatted}`;

      if (totalSeconds <= 60) {
        timerDisplay.style.color = '#ef4444';
      } else if (totalSeconds <= 300) {
        timerDisplay.style.color = '#f59e0b';
      } else {
        timerDisplay.style.color = '#38bdf8';
      }
    }

    function startLocalCountdown() {
      stopLocalCountdown();
      localCountdownTimer = setInterval(() => {
        if (currentRemainingSeconds > 0) {
          currentRemainingSeconds--;
          updateTimerDisplay(currentRemainingSeconds);
          if (currentRemainingSeconds <= 0) {
            cleanup();
            status.innerText = "Status: Terminated — Maximum Time Limit Reached";
            status.style.color = "#ef4444";
            alert(`Stream stopped: You have run out of streaming time.`);
          }
        }
      }, 1000);
    }

    function stopLocalCountdown() {
      if (localCountdownTimer) {
        clearInterval(localCountdownTimer);
        localCountdownTimer = null;
      }
    }

    function startUsageSyncing(userId) {
      stopUsageSyncing();
      syncTimer = setInterval(async () => {
        await pushUsageToSupabase(userId, UPDATE_INTERVAL_SECONDS);
      }, UPDATE_INTERVAL_SECONDS * 1000);
    }

    async function pushUsageToSupabase(userId, secondsToAdd) {
      if (!userId) return;
      try {
        const { data: user, error: userErr } = await supabaseClient
          .from('users')
          .select('streaming_seconds_used, max_streaming_seconds')
          .eq('user_id', userId)
          .maybeSingle();

        if (userErr || !user) return;

        const currentUsed = user.streaming_seconds_used || 0;
        const allowedMax = user.max_streaming_seconds ?? maxLimit;
        const newTotal = currentUsed + secondsToAdd;

        if (newTotal >= allowedMax) {
          await supabaseClient
            .from('users')
            .update({ streaming_seconds_used: allowedMax })
            .eq('user_id', userId);
          cleanup();
          status.innerText = "Status: Terminated — Maximum Time Limit Reached";
          status.style.color = "#ef4444";
          alert(`Stream stopped: You have reached your maximum streaming limit.`);
          return;
        }

        await supabaseClient
          .from('users')
          .update({ streaming_seconds_used: newTotal })
          .eq('user_id', userId);
      } catch (err) {
        console.warn("Usage sync error:", err.message);
      }
    }

    function stopUsageSyncing() {
      if (syncTimer) {
        clearInterval(syncTimer);
        syncTimer = null;
      }
    }

    function isStreamingActive() {
      return mediaRecorder && mediaRecorder.state !== 'inactive';
    }

    // Supported Spoken Languages (BCP-47 Standard)
    const SUPPORTED_LANGUAGES = [
      { code: 'en-US', name: 'English (United States)' },
      { code: 'en-AU', name: 'English (Australia)' },
      { code: 'en-GB', name: 'English (United Kingdom)' },
      { code: 'es-ES', name: 'Spanish (Spain)' },
      { code: 'es-419', name: 'Spanish (Latin America)' },
      { code: 'fr-FR', name: 'French (France)' },
      { code: 'de-DE', name: 'German' },
      { code: 'zh-CN', name: 'Chinese (Simplified)' },
      { code: 'zh-TW', name: 'Chinese (Traditional)' },
      { code: 'ar-SA', name: 'Arabic' },
      { code: 'hi-IN', name: 'Hindi' },
      { code: 'ja-JP', name: 'Japanese' },
      { code: 'pt-BR', name: 'Portuguese (Brazil)' },
      { code: 'ru-RU', name: 'Russian' },
      { code: 'it-IT', name: 'Italian' }
    ];

    function initLanguageSelector(defaultCode = 'en-US') {
      const selectElem = document.getElementById('languageSelect');
      if (!selectElem) return;
      selectElem.innerHTML = '';
      SUPPORTED_LANGUAGES.forEach((lang) => {
        const opt = document.createElement('option');
        opt.value = lang.code;
        opt.textContent = `${lang.name} (${lang.code})`;
        if (lang.code === defaultCode) opt.selected = true;
        selectElem.appendChild(opt);
      });
      selectElem.addEventListener('change', (e) => {
        localStorage.setItem('presenter_lang', e.target.value);
      });
    }

    // Output Language Tabs Control
    function initOutputLangTabs() {
      const tabs = document.querySelectorAll('#outputLangTabs .lang-tab');
      tabs.forEach((tab) => {
        tab.addEventListener('click', () => {
          tabs.forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
          targetOutputLang = tab.dataset.lang;
          if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ type: "set_language", lang: targetOutputLang }));
          }
        });
      });
    }

    // Push style updates to server/overlay
    function updateStyles() {
      const styles = {
        fontSize: document.getElementById('fontSizeInput').value + 'px',
        fontFamily: document.getElementById('fontFamilyInput').value,
        fontWeight: document.getElementById('boldInput').checked ? 'bold' : 'normal',
        fontStyle: document.getElementById('italicInput').checked ? 'italic' : 'normal',
        animation: document.getElementById('animationInput').value,
        textColor: document.getElementById('textColorInput').value
      };

      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type:
