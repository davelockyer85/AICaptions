<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Presenter Audio Ingest - AICaptions</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #111827; color: #f3f4f6; padding: 2rem; text-align: center; margin: 0; }
    .card { max-width: 550px; margin: 2rem auto; background: #1f2937; padding: 2rem; border-radius: 12px; border: 1px solid #374151; }
    h1 { color: #60a5fa; margin-top: 0; }
    .room-badge { display: inline-block; background: #374151; color: #93c5fd; padding: 0.25rem 0.75rem; border-radius: 9999px; font-family: monospace; font-weight: bold; margin-bottom: 1rem; }
    .timer-badge { background: #111827; border: 1px solid #374151; color: #38bdf8; font-size: 1.25rem; font-weight: 700; font-family: monospace; padding: 0.6rem; border-radius: 8px; margin: 1rem 0; }
    .setting-group { margin-top: 1.25rem; text-align: left; }
    .setting-label { display: block; font-size: 0.85rem; color: #9ca3af; margin-bottom: 0.5rem; font-weight: 600; }
    select { width: 100%; padding: 0.6rem; background: #111827; color: #f3f4f6; border: 1px solid #374151; border-radius: 8px; outline: none; }
    .language-tabs { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .tab-btn { background: #111827; color: #9ca3af; border: 1px solid #374151; padding: 0.6rem; border-radius: 8px; cursor: pointer; font-size: 0.85rem; font-weight: 600; flex: 1 1 calc(33.333% - 0.5rem); }
    .tab-btn.active { background: #2563eb; color: white; border-color: #3b82f6; }
    .btn-group { display: flex; gap: 1rem; justify-content: center; margin-top: 2rem; }
    button.action-btn { padding: 0.85rem 1.75rem; font-size: 1rem; font-weight: 600; border: none; border-radius: 8px; cursor: pointer; }
    #startBtn { background: #2563eb; color: white; }
    #stopBtn { background: #dc2626; color: white; }
    #stopBtn:disabled, #startBtn:disabled { background: #4b5563; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Stage Audio Transmitter</h1>
    <div class="room-badge" id="roomDisplay">main-stage</div>
    <div class="timer-badge" id="timerDisplay">Remaining Time: --:--</div>

    <div class="setting-group">
      <label class="setting-label">Spoken Language</label>
      <select id="languageSelect">
        <option value="en-US">English (United States)</option>
        <option value="en-AU">English (Australia)</option>
        <option value="es-ES">Spanish (Spain)</option>
        <option value="fr-FR">French (France)</option>
        <option value="de-DE">German</option>
      </select>
    </div>

    <div class="setting-group">
      <label class="setting-label">Overlay Output Translation</label>
      <div class="language-tabs" id="translationTabs">
        <button class="tab-btn active" data-lang="none">No Translation</button>
        <button class="tab-btn" data-lang="es-ES">Spanish</button>
        <button class="tab-btn" data-lang="fr-FR">French</button>
        <button class="tab-btn" data-lang="de-DE">German</button>
        <button class="tab-btn" data-lang="zh-CN">Chinese</button>
        <button class="tab-btn" data-lang="ja-JP">Japanese</button>
      </div>
    </div>

    <div class="btn-group">
      <button class="action-btn" id="startBtn">Start Streaming</button>
      <button class="action-btn" id="stopBtn" disabled>Stop</button>
    </div>
    <p id="status" style="margin-top:1.5rem; font-weight:600; color:#9ca3af;">Status: Disconnected</p>
  </div>

  <script>
    const SUPABASE_URL = 'https://euopdmwtowuxdzczwbul.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_UQHJUuyX1-nHwpJ6ilgD7g_BZ0vNUWB';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const urlParams = new URLSearchParams(window.location.search);
    const room = urlParams.get('room') || 'main-stage';
    let currentTargetLang = localStorage.getItem('target_lang') || 'none';

    document.getElementById('roomDisplay').innerText = room;

    let ws = null;
    let mediaRecorder = null;
    let audioStream = null;
    let roomBroadcastChannel = null;

    async function broadcastLanguageChange(targetLang) {
      if (!roomBroadcastChannel) {
        roomBroadcastChannel = supabaseClient.channel(`room_${room}`);
        await roomBroadcastChannel.subscribe();
      }
      roomBroadcastChannel.send({
        type: 'broadcast',
        event: 'target_lang_change',
        payload: { targetLang, room }
      });
    }

    // Tab Selection Event Listeners
    document.querySelectorAll('.tab-btn').forEach(btn => {
      if (btn.dataset.lang === currentTargetLang) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      }

      btn.onclick = (e) => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        currentTargetLang = e.target.dataset.lang;
        localStorage.setItem('target_lang', currentTargetLang);

        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: 'config', targetLang: currentTargetLang }));
        }
        broadcastLanguageChange(currentTargetLang);
      };
    });

    document.getElementById('startBtn').onclick = async () => {
      try {
        audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const spokenLang = document.getElementById('languageSelect').value;

        const protocol = location.protocol === "https:" ? "wss:" : "ws:";
        const wsUrl = `${protocol}//${location.host}?room=${encodeURIComponent(room)}&role=presenter&lang=${encodeURIComponent(spokenLang)}&target_lang=${encodeURIComponent(currentTargetLang)}`;

        ws = new WebSocket(wsUrl);

        ws.onopen = () => {
          document.getElementById('status').innerText = "Status: Streaming Live Audio";
          document.getElementById('status').style.color = "#10b981";

          mediaRecorder = new MediaRecorder(audioStream);
          mediaRecorder.ondataavailable = (e) => {
            if (e.data.size > 0 && ws.readyState === WebSocket.OPEN) ws.send(e.data);
          };
          mediaRecorder.start(250);

          document.getElementById('startBtn').disabled = true;
          document.getElementById('stopBtn').disabled = false;
          broadcastLanguageChange(currentTargetLang);
        };
      } catch (err) {
        document.getElementById('status').innerText = "Status: Mic Access Denied";
      }
    };

    document.getElementById('stopBtn').onclick = () => {
      if (mediaRecorder) mediaRecorder.stop();
      if (audioStream) audioStream.getTracks().forEach(t => t.stop());
      if (ws) ws.close();
      document.getElementById('startBtn').disabled = false;
      document.getElementById('stopBtn').disabled = true;
      document.getElementById('status').innerText = "Status: Stopped";
    };
  </script>
</body>
</html>
