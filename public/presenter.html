<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Presenter Audio Ingest - AICaptions</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #111827;
      color: #f3f4f6;
      padding: 2rem;
      text-align: center;
      margin: 0;
    }
    .card {
      max-width: 500px;
      margin: 2rem auto;
      background: #1f2937;
      padding: 2rem;
      border-radius: 12px;
      border: 1px solid #374151;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
    }
    h1 { margin-top: 0; color: #60a5fa; font-size: 1.75rem; }
    p { color: #9ca3af; }
    .room-badge {
      display: inline-block;
      background: #374151;
      color: #93c5fd;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-family: monospace;
      font-weight: bold;
      margin-bottom: 1.5rem;
    }
    .btn-group {
      display: flex;
      gap: 1rem;
      justify-content: center;
      margin-top: 1.5rem;
    }
    button {
      padding: 0.85rem 1.75rem;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    #startBtn { background: #2563eb; color: white; }
    #startBtn:hover { background: #1d4ed8; }
    #startBtn:disabled { background: #4b5563; cursor: not-allowed; }
    #stopBtn { background: #dc2626; color: white; }
    #stopBtn:hover { background: #b91c1c; }
    #stopBtn:disabled { background: #4b5563; cursor: not-allowed; }
    #status {
      margin-top: 1.5rem;
      font-weight: 600;
      font-size: 1.1rem;
      color: #9ca3af;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Stage Audio Transmitter</h1>
    <p>Room Identifier:</p>
    <div class="room-badge" id="roomDisplay">main-stage</div>

    <!-- Spoken / Ingest Language Selector -->
    <div class="setting-group" style="margin-top: 1rem; text-align: left;">
      <label for="languageSelect" style="display: block; font-size: 0.85rem; color: #9ca3af; margin-bottom: 0.5rem; font-weight: 600;">
        Spoken Language

      <select id="languageSelect" style="width: 100%; padding: 0.6rem 0.8rem; background-color: #111827; color: #f3f4f6; border: 1px solid #374151; border-radius: 8px; font-size: 0.95rem; outline: none; cursor: pointer;">
        <option value="af-ZA">Afrikaans (af-ZA)</option>
        <option value="sq-AL">Albanian (sq-AL)</option>
        <option value="am-ET">Amharic (am-ET)</option>
        <option value="ar-SA">Arabic (ar-SA)</option>
        <option value="hy-AM">Armenian (hy-AM)</option>
        <option value="az-AZ">Azerbaijani (az-AZ)</option>
        <option value="eu-ES">Basque (eu-ES)</option>
        <option value="be-BY">Belarusian (be-BY)</option>
        <option value="bn-IN">Bengali (bn-IN)</option>
        <option value="bs-BA">Bosnian (bs-BA)</option>
        <option value="bg-BG">Bulgarian (bg-BG)</option>
        <option value="ca-ES">Catalan (ca-ES)</option>
        <option value="zh-CN">Chinese (Simplified) (zh-CN)</option>
        <option value="zh-TW">Chinese (Traditional) (zh-TW)</option>
        <option value="hr-HR">Croatian (hr-HR)</option>
        <option value="cs-CZ">Czech (cs-CZ)</option>
        <option value="da-DK">Danish (da-DK)</option>
        <option value="nl-NL">Dutch (nl-NL)</option>
        <option value="en-AU">English (Australia) (en-AU)</option>
        <option value="en-GB">English (United Kingdom) (en-GB)</option>
        <option value="en-US" selected>English (United States) (en-US)</option>
        <option value="eo">Esperanto (eo)</option>
        <option value="et-EE">Estonian (et-EE)</option>
        <option value="fil-PH">Filipino (fil-PH)</option>
        <option value="fi-FI">Finnish (fi-FI)</option>
        <option value="fr-CA">French (Canada) (fr-CA)</option>
        <option value="fr-FR">French (France) (fr-FR)</option>
        <option value="gl-ES">Galician (gl-ES)</option>
        <option value="ka-GE">Georgian (ka-GE)</option>
        <option value="de-DE">German (de-DE)</option>
        <option value="el-GR">Greek (el-GR)</option>
        <option value="gu-IN">Gujarati (gu-IN)</option>
        <option value="ht">Haitian Creole (ht)</option>
        <option value="ha-NG">Hausa (ha-NG)</option>
        <option value="he-IL">Hebrew (he-IL)</option>
        <option value="hi-IN">Hindi (hi-IN)</option>
        <option value="hu-HU">Hungarian (hu-HU)</option>
        <option value="is-IS">Icelandic (is-IS)</option>
        <option value="id-ID">Indonesian (id-ID)</option>
        <option value="ga-IE">Irish (ga-IE)</option>
        <option value="it-IT">Italian (it-IT)</option>
        <option value="ja-JP">Japanese (ja-JP)</option>
        <option value="jv-ID">Javanese (jv-ID)</option>
        <option value="kn-IN">Kannada (kn-IN)</option>
        <option value="kk-KZ">Kazakh (kk-KZ)</option>
        <option value="km-KH">Khmer (km-KH)</option>
        <option value="ko-KR">Korean (ko-KR)</option>
        <option value="lo-LA">Lao (lo-LA)</option>
        <option value="lv-LV">Latvian (lv-LV)</option>
        <option value="lt-LT">Lithuanian (lt-LT)</option>
        <option value="mk-MK">Macedonian (mk-MK)</option>
        <option value="ms-MY">Malay (ms-MY)</option>
        <option value="ml-IN">Malayalam (ml-IN)</option>
        <option value="mt-MT">Maltese (mt-MT)</option>
        <option value="mr-IN">Marathi (mr-IN)</option>
        <option value="mn-MN">Mongolian (mn-MN)</option>
        <option value="ne-NP">Nepali (ne-NP)</option>
        <option value="nb-NO">Norwegian (nb-NO)</option>
        <option value="fa-IR">Persian (fa-IR)</option>
        <option value="pl-PL">Polish (pl-PL)</option>
        <option value="pt-BR">Portuguese (Brazil) (pt-BR)</option>
        <option value="pt-PT">Portuguese (Portugal) (pt-PT)</option>
        <option value="pa-IN">Punjabi (pa-IN)</option>
        <option value="ro-RO">Romanian (ro-RO)</option>
        <option value="ru-RU">Russian (ru-RU)</option>
        <option value="sr-RS">Serbian (sr-RS)</option>
        <option value="si-LK">Sinhala (si-LK)</option>
        <option value="sk-SK">Slovak (sk-SK)</option>
        <option value="sl-SI">Slovenian (sl-SI)</option>
        <option value="so-SO">Somali (so-SO)</option>
        <option value="es-419">Spanish (Latin America) (es-419)</option>
        <option value="es-ES">Spanish (Spain) (es-ES)</option>
        <option value="su-ID">Sundanese (su-ID)</option>
        <option value="sw-KE">Swahili (sw-KE)</option>
        <option value="sv-SE">Swedish (sv-SE)</option>
        <option value="ta-IN">Tamil (ta-IN)</option>
        <option value="te-IN">Telugu (te-IN)</option>
        <option value="th-TH">Thai (th-TH)</option>
        <option value="tr-TR">Turkish (tr-TR)</option>
        <option value="uk-UA">Ukrainian (uk-UA)</option>
        <option value="ur-PK">Urdu (ur-PK)</option>
        <option value="uz-UZ">Uzbek (uz-UZ)</option>
        <option value="vi-VN">Vietnamese (vi-VN)</option>
      </select>
    </div>

    <div class="btn-group">
      <button id="startBtn">Start Streaming</button>
      <button id="stopBtn" disabled>Stop</button>
    </div>

    <p id="status">Status: Disconnected</p>
  </div>

  <script>
    // Read room & token from URL parameters or storage
    const urlParams = new URLSearchParams(window.location.search);
    const room = urlParams.get('room') || urlParams.get('roomId') || 'main-stage';
    
    // Attempt to locate Supabase session token if present
    const urlToken = urlParams.get('token');
    const localToken = localStorage.getItem('supabase.auth.token') 
      ? JSON.parse(localStorage.getItem('supabase.auth.token'))?.currentSession?.access_token 
      : null;
    const token = urlToken || localToken || '';

    document.getElementById('roomDisplay').innerText = room;

    // Restore saved language selection if present
    const langSelect = document.getElementById('languageSelect');
    const savedLang = localStorage.getItem('presenter_lang');
    if (savedLang && langSelect) {
      langSelect.value = savedLang;
    }
    if (langSelect) {
      langSelect.addEventListener('change', (e) => {
        localStorage.setItem('presenter_lang', e.target.value);
      });
    }

    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const status = document.getElementById('status');

    let ws = null;
    let mediaRecorder = null;
    let audioStream = null;

    startBtn.onclick = async () => {
      try {
        status.innerText = "Status: Requesting Microphone Access...";
        status.style.color = "#f59e0b";

        audioStream = await navigator.mediaDevices.getUserMedia({ 
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true
          } 
        });

        const selectedLang = langSelect ? langSelect.value : 'en-US';

        // Build WebSocket connection string with room, role, selected language, and token
        const protocol = location.protocol === "https:" ? "wss:" : "ws:";
        let wsUrl = `${protocol}//${location.host}?room=${encodeURIComponent(room)}&role=presenter&lang=${encodeURIComponent(selectedLang)}`;
        if (token) {
          wsUrl += `&token=${encodeURIComponent(token)}`;
        }

        ws = new WebSocket(wsUrl);

        ws.onopen = () => {
          status.innerText = "Status: Live & Streaming Stage Audio";
          status.style.color = "#10b981";

          // Select supported audio MIME type for MediaRecorder
          let mimeType = 'audio/webm;codecs=opus';
          if (!MediaRecorder.isTypeSupported(mimeType)) {
            mimeType = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : '';
          }

          mediaRecorder = new MediaRecorder(audioStream, mimeType ? { mimeType } : undefined);

          mediaRecorder.ondataavailable = (e) => {
            if (e.data.size > 0 && ws && ws.readyState === WebSocket.OPEN) {
              ws.send(e.data);
            }
          };

          // Send 250ms chunks to Deepgram
          mediaRecorder.start(250);

          startBtn.disabled = true;
          stopBtn.disabled = false;
        };

        // Broadcast room presence/tick over WebSockets
        if (typeof supabase !== 'undefined') {
          const channel = supabase.channel(`room_${room}`, {
            config: { broadcast: { self: true } }
          });

          channel.subscribe((status) => {
            if (status === 'SUBSCRIBED') {
              setInterval(() => {
                channel.send({
                  type: 'broadcast',
                  event: 'timer_tick',
                  payload: { elapsed: 1 }
                });
              }, 1000);
            }
          });

          channel.on('broadcast', { event: 'timer_tick' }, (response) => {
            localElapsedCounter += response.payload.elapsed;
            if (localElapsedCounter >= maxLimit) {
              stopStream();
            }
          });
        }

        ws.onerror = (err) => {
          console.error("WebSocket Error:", err);
          status.innerText = "Status: Connection Error";
          status.style.color = "#ef4444";
        };

        ws.onclose = (e) => {
          status.innerText = e.reason ? `Status: Closed (${e.reason})` : "Status: Disconnected";
          status.style.color = "#ef4444";
          cleanup();
        };

      } catch (err) {
        console.error("Microphone Access Error:", err);
        status.innerText = "Status: Microphone Access Denied";
        status.style.color = "#ef4444";
      }
    };

    stopBtn.onclick = () => {
      cleanup();
      status.innerText = "Status: Stopped";
      status.style.color = "#9ca3af";
    };

    function cleanup() {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
      }
      if (audioStream) {
        audioStream.getTracks().forEach(track => track.stop());
      }
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.close();
      }
      startBtn.disabled = false;
      stopBtn.disabled = true;
    }
  </script>
</body>
</html>
