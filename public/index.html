<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AICaptions - Live Presenter Dashboard</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 2rem; }
    .container { max-width: 800px; margin: 0 auto; }
    h1 { color: #38bdf8; }
    .card { background: #1e293b; padding: 1.5rem; border-radius: 8px; margin-bottom: 1.5rem; border: 1px solid #334155; }
    button { background: #0284c7; color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 6px; cursor: pointer; font-size: 1rem; font-weight: bold; }
    button:disabled { background: #475569; cursor: not-allowed; }
    .caption-box { font-size: 1.5rem; min-height: 120px; background: #090d16; padding: 1rem; border-radius: 6px; border: 1px solid #334155; line-height: 1.4; color: #f1f5f9; }
    .link-box { background: #0f172a; padding: 0.75rem; border-radius: 4px; font-family: monospace; color: #38bdf8; word-break: break-all; border: 1px solid #334155; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎙️ AICaptions Presenter Dashboard</h1>
    <p>Real-time speech-to-text captions for live streams and presentations.</p>

    <div class="card">
      <p><strong>Room ID:</strong> <span id="roomIdDisplay">...</span></p>
      <p><strong>OBS Overlay URL:</strong></p>
      <div class="link-box" id="overlayUrl">...</div>
      <br>
      <button id="startBtn">Start Live Captioning</button>
      <button id="stopBtn" disabled>Stop</button>
    </div>

    <div class="card">
      <h3>Live Transcript Output</h3>
      <div id="captionDisplay" class="caption-box">Click "Start Live Captioning" to begin talking...</div>
    </div>

    <p><a href="/pricing.html" style="color: #38bdf8;">View Subscription Plans</a></p>
  </div>

  <script>
    const roomId = Math.random().toString(36).substring(2, 8);
    document.getElementById('roomIdDisplay').innerText = roomId;
    const overlayFullUrl = `${window.location.origin}/overlay.html?roomId=${roomId}`;
    document.getElementById('overlayUrl').innerText = overlayFullUrl;

    let ws;
    let mediaRecorder;

    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const captionDisplay = document.getElementById('captionDisplay');

    startBtn.onclick = async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        ws = new WebSocket(`${wsProtocol}//${window.location.host}?roomId=${roomId}&role=presenter`);

        ws.onopen = () => {
          mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });
          mediaRecorder.ondataavailable = (event) => {
            if (event.data.size > 0 && ws.readyState === WebSocket.OPEN) {
              ws.send(event.data);
            }
          };
          mediaRecorder.start(250);
          startBtn.disabled = true;
          stopBtn.disabled = false;
          captionDisplay.innerText = "Listening...";
        };

        ws.onmessage = (event) => {
          const data = JSON.parse(event.data);
          if (data.type === 'caption') {
            captionDisplay.innerText = data.text;
          }
        };
      } catch (err) {
        alert("Microphone access denied or unsupported.");
      }
    };

    stopBtn.onclick = () => {
      if (mediaRecorder) mediaRecorder.stop();
      if (ws) ws.close();
      startBtn.disabled = false;
      stopBtn.disabled = true;
      captionDisplay.innerText = "Stopped.";
    };
  </script>
</body>
</html>
