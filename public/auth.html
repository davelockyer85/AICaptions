<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authentication - Stage Captions</title>
  
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .auth-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 32px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .auth-tabs {
      display: flex;
      background-color: #0f172a;
      border-radius: 8px;
      padding: 4px;
      margin-bottom: 24px;
      border: 1px solid #334155;
    }
    .tab-btn {
      flex: 1;
      padding: 10px;
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background-color: #3b82f6;
      color: #ffffff;
    }
    .auth-header { text-align: center; margin-bottom: 24px; }
    .auth-header h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 6px; }
    .auth-header p { color: #94a3b8; font-size: 0.9rem; }
    .form-group { margin-bottom: 18px; }
    label { display: block; font-size: 0.875rem; font-weight: 600; color: #cbd5e1; margin-bottom: 6px; }
    input {
      width: 100%;
      padding: 12px 16px;
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #f8fafc;
      font-size: 1rem;
      outline: none;
    }
    input:focus { border-color: #3b82f6; }
    button[type="submit"] {
      width: 100%;
      padding: 14px;
      background-color: #3b82f6;
      color: #ffffff;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
    }
    button[type="submit"]:hover { background-color: #2563eb; }
    button[type="submit"]:disabled { background-color: #475569; cursor: not-allowed; }
    #messageBox {
      display: none;
      margin-bottom: 20px;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.875rem;
      text-align: center;
    }
    .msg-error { background-color: rgba(239, 68, 68, 0.15); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.3); }
    .msg-success { background-color: rgba(34, 197, 94, 0.15); color: #86efac; border: 1px solid rgba(34, 197, 94, 0.3); }
  </style>
</head>
<body>

  <div class="auth-card">
    <div class="auth-tabs">
      <button type="button" class="tab-btn active" id="loginTab">Sign In</button>
      <button type="button" class="tab-btn" id="signupTab">Sign Up</button>
    </div>

    <div class="auth-header">
      <h1 id="formTitle">Welcome Back</h1>
      <p id="formSubtitle">Sign in to manage your stage captions</p>
    </div>

    <div id="messageBox"></div>

    <form id="authForm">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" required placeholder="you@company.com" autocomplete="email">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required placeholder="••••••••" autocomplete="current-password" minlength="6">
      </div>

      <button type="submit" id="submitBtn">Sign In</button>
    </form>
  </div>

  <script>
    // Configured Supabase Credentials
    const SUPABASE_URL = 'https://euopdmwtowuxdzczwbul.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_UQHJUuyX1-nHwpJ6ilgD7g_BZ0vNUWB';

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let isLoginMode = true;
    
    const loginTab = document.getElementById('loginTab');
    const signupTab = document.getElementById('signupTab');
    const authForm = document.getElementById('authForm');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const submitBtn = document.getElementById('submitBtn');
    const formTitle = document.getElementById('formTitle');
    const formSubtitle = document.getElementById('formSubtitle');
    const messageBox = document.getElementById('messageBox');

    loginTab.addEventListener('click', () => setMode(true));
    signupTab.addEventListener('click', () => setMode(false));

    function setMode(login) {
      isLoginMode = login;
      showMessage('', '');

      if (isLoginMode) {
        loginTab.classList.add('active');
        signupTab.classList.remove('active');
        formTitle.innerText = "Welcome Back";
        formSubtitle.innerText = "Sign in to manage your stage captions";
        submitBtn.innerText = "Sign In";
      } else {
        signupTab.classList.add('active');
        loginTab.classList.remove('active');
        formTitle.innerText = "Create Account";
        formSubtitle.innerText = "Start generating live captions today";
        submitBtn.innerText = "Create Account";
      }
    }

    function showMessage(text, type) {
      if (!text) {
        messageBox.style.display = 'none';
        return;
      }
      messageBox.style.display = 'block';
      messageBox.innerText = text;
      messageBox.className = type === 'error' ? 'msg-error' : 'msg-success';
    }

    authForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = emailInput.value.trim();
      const password = passwordInput.value;
      
      submitBtn.disabled = true;
      submitBtn.innerText = "Processing...";
      showMessage('', '');

      try {
        if (isLoginMode) {
          const { data, error } = await supabase.auth.signInWithPassword({ email, password });
          if (error) throw error;

          showMessage('Login successful! Redirecting...', 'success');
          setTimeout(() => window.location.href = '/dashboard.html', 1000);
        } else {
          const { data, error } = await supabase.auth.signUp({ email, password });
          if (error) throw error;

          if (data.session) {
            showMessage('Account created successfully! Redirecting...', 'success');
            setTimeout(() => window.location.href = '/dashboard.html', 1000);
          } else {
            showMessage('Account created! Please check your email inbox to confirm your registration.', 'success');
          }
        }
      } catch (err) {
        showMessage(err.message || 'Authentication failed', 'error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = isLoginMode ? "Sign In" : "Create Account";
      }
    });

    async function checkSession() {
      const { data: { session } } = await supabase.auth.getSession();
      if (session) {
        window.location.href = '/dashboard.html';
      }
    }
    checkSession();
  </script>
</body>
</html>
