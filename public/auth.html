<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authentication - AICaptions</title>
  
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --border-color: #334155;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --error-red: #ef4444;
      --success-green: #22c55e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top Header Navigation */
    header {
      background-color: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      padding: 16px 48px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Clickable Logo linking back to landing page */
    .brand {
      font-size: 1.35rem;
      font-weight: 800;
      color: #ffffff;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 10px;
      letter-spacing: -0.5px;
      transition: opacity 0.2s;
    }

    .brand:hover {
      opacity: 0.9;
    }

    .brand span { color: var(--primary); }

    /* Main Auth Container */
    .auth-wrapper {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
    }

    .auth-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      width: 100%;
      max-width: 420px;
      padding: 40px 32px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
    }

    .auth-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .auth-header h1 {
      font-size: 1.75rem;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .auth-header p {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    /* Form Styles */
    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 8px;
    }

    .form-group input {
      width: 100%;
      padding: 12px 16px;
      background-color: var(--bg-dark);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus {
      border-color: var(--primary);
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background-color: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 10px;
    }

    .btn-submit:hover {
      background-color: var(--primary-hover);
    }

    .btn-submit:disabled {
      background-color: var(--border-color);
      cursor: not-allowed;
    }

    /* Toggle Links */
    .auth-toggle {
      text-align: center;
      margin-top: 24px;
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    .auth-toggle a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      cursor: pointer;
    }

    .auth-toggle a:hover {
      text-decoration: underline;
    }

    /* Feedback Alerts */
    .alert {
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.875rem;
      margin-bottom: 20px;
      display: none;
    }

    .alert.error {
      background-color: rgba(239, 68, 68, 0.1);
      border: 1px solid var(--error-red);
      color: var(--error-red);
    }

    .alert.success {
      background-color: rgba(34, 197, 94, 0.1);
      border: 1px solid var(--success-green);
      color: var(--success-green);
    }

    @media (max-width: 600px) {
      header { padding: 16px 20px; }
    }
  </style>
</head>
<body>

  <!-- Header with Brand Logo linking back to landing page -->
  <header>
    <a href="/" class="brand">
      🎙️ AICaptions
    </a>
  </header>

  <!-- Main Auth Form Container -->
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h1 id="authTitle">Welcome Back</h1>
        <p id="authSubtitle">Enter your details to sign in to your account</p>
      </div>

      <div id="alertBox" class="alert"></div>

      <form id="authForm">
        <div class="form-group">
          <label for="email">Email address</label>
          <input type="email" id="email" placeholder="name@company.com" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="••••••••" required minlength="6">
        </div>

        <button type="submit" id="submitBtn" class="btn-submit">Sign In</button>
      </form>

      <div class="auth-toggle">
        <span id="toggleText">Don't have an account?</span>
        <a id="toggleBtn" onclick="toggleAuthMode()">Sign up</a>
      </div>
    </div>
  </div>

  <script>
    // Supabase Client Initialization
    const SUPABASE_URL = 'https://euopdmwtowuxdzczwbul.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_UQHJUuyX1-nHwpJ6ilgD7g_BZ0vNUWB';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let isSignUp = false;

    // Toggle between Login and Sign Up modes
    function toggleAuthMode() {
      isSignUp = !isSignUp;
      const title = document.getElementById('authTitle');
      const subtitle = document.getElementById('authSubtitle');
      const submitBtn = document.getElementById('submitBtn');
      const toggleText = document.getElementById('toggleText');
      const toggleBtn = document.getElementById('toggleBtn');
      const alertBox = document.getElementById('alertBox');

      alertBox.style.display = 'none';

      if (isSignUp) {
        title.innerText = 'Create an Account';
        subtitle.innerText = 'Start transcribing stage live streams in seconds';
        submitBtn.innerText = 'Sign Up';
        toggleText.innerText = 'Already have an account?';
        toggleBtn.innerText = 'Sign in';
      } else {
        title.innerText = 'Welcome Back';
        subtitle.innerText = 'Enter your details to sign in to your account';
        submitBtn.innerText = 'Sign In';
        toggleText.innerText = "Don't have an account?";
        toggleBtn.innerText = 'Sign up';
      }
    }

    // Handle Form Submission
    document.getElementById('authForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const submitBtn = document.getElementById('submitBtn');
      const alertBox = document.getElementById('alertBox');

      submitBtn.disabled = true;
      alertBox.style.display = 'none';

      try {
        if (isSignUp) {
          const { data, error } = await supabaseClient.auth.signUp({ email, password });
          if (error) throw error;

          alertBox.className = 'alert success';
          alertBox.innerText = 'Account created! Please check your email for confirmation or log in.';
          alertBox.style.display = 'block';
        } else {
          const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
          if (error) throw error;

          // Redirect on successful sign in
          window.location.href = '/dashboard.html';
        }
      } catch (err) {
        alertBox.className = 'alert error';
        alertBox.innerText = err.message;
        alertBox.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
      }
    });

    // Auto-redirect if user is already logged in
    async function checkExistingSession() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) {
        window.location.href = '/dashboard.html';
      }
    }

    checkExistingSession();
  </script>
</body>
</html>
