<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authentication - AICaptions</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    .card { background-color: #1e293b; border: 1px solid #334155; border-radius: 0.75rem; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">

  <div class="card w-full max-w-md p-8 space-y-6 shadow-2xl">
    
    <!-- Logo & Header -->
    <div class="text-center space-y-2">
      <div class="text-4xl">🎙️</div>
      <h1 class="text-2xl font-bold tracking-tight text-white">AICaptions</h1>
      <p id="auth-subtitle" class="text-xs text-slate-400">Sign in to manage your studio, stages, and captions.</p>
    </div>

    <!-- Alert / Status Banner -->
    <div id="alert-banner" class="hidden p-3 rounded-lg text-xs font-medium border"></div>

    <!-- Auth Form -->
    <form id="auth-form" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Email Address</label>
        <input id="email" type="email" required placeholder="you@domain.com" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500 transition">
      </div>

      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Password</label>
        <input id="password" type="password" required placeholder="••••••••" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500 transition">
      </div>

      <button id="submit-btn" type="submit" class="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-lg text-sm transition shadow-lg shadow-blue-600/20">
        Sign In
      </button>
    </form>

    <!-- Toggle Sign In / Sign Up -->
    <div class="text-center pt-2 border-t border-slate-800">
      <button id="toggle-mode-btn" class="text-xs text-blue-400 hover:text-blue-300 font-medium underline">
        Need an account? Sign Up
      </button>
    </div>

  </div>

  <script>
    const SUPABASE_URL = "https://euopdmwtowuxdzczwbul.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV1b3BkbXd0b3d1eGR6Y3p3YnVsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDEyNDAwMDB9.s8U3eU_...v2";
    
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let isSignUp = false;

    const authForm = document.getElementById('auth-form');
    const submitBtn = document.getElementById('submit-btn');
    const toggleBtn = document.getElementById('toggle-mode-btn');
    const subtitle = document.getElementById('auth-subtitle');
    const alertBanner = document.getElementById('alert-banner');

    function showAlert(msg, isError = true) {
      alertBanner.innerText = msg;
      alertBanner.className = `p-3 rounded-lg text-xs font-medium border ${isError ? 'bg-red-500/10 text-red-400 border-red-500/20' : 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20'}`;
      alertBanner.classList.remove('hidden');
    }

    toggleBtn.addEventListener('click', (e) => {
      e.preventDefault();
      isSignUp = !isSignUp;
      alertBanner.classList.add('hidden');
      if (isSignUp) {
        submitBtn.innerText = "Create Account";
        subtitle.innerText = "Sign up for a free account to start streaming.";
        toggleBtn.innerText = "Already have an account? Sign In";
      } else {
        submitBtn.innerText = "Sign In";
        subtitle.innerText = "Sign in to manage your studio, stages, and captions.";
        toggleBtn.innerText = "Need an account? Sign Up";
      }
    });

    authForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBanner.classList.add('hidden');
      submitBtn.disabled = true;
      submitBtn.innerText = "Processing...";

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        if (isSignUp) {
          const { data, error } = await supabase.auth.signUp({ email, password });
          if (error) throw error;

          // Ensure profile row exists in custom users table
          if (data.user) {
            await supabase.from('users').upsert({
              id: data.user.id,
              email: data.user.email,
              plan_tier: 'free',
              max_streaming_seconds: 18000,
              streaming_seconds_used: 0
            });
          }

          showAlert("Account created! Redirecting to dashboard...", false);
          setTimeout(() => window.location.href = "/dashboard.html", 1000);
        } else {
          const { data, error } = await supabase.auth.signInWithPassword({ email, password });
          if (error) throw error;

          showAlert("Sign in successful! Redirecting...", false);
          setTimeout(() => window.location.href = "/dashboard.html", 800);
        }
      } catch (err) {
        showAlert(err.message || "Authentication failed.");
        submitBtn.disabled = false;
        submitBtn.innerText = isSignUp ? "Create Account" : "Sign In";
      }
    });

    // Check if user is already logged in
    supabase.auth.getSession().then(({ data: { session } }) => {
      if (session) {
        window.location.href = "/dashboard.html";
      }
    });
  </script>
</body>
</html>
