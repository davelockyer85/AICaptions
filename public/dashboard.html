<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - AICaptions</title>
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- QRCode.js CDN for audience QR code generation -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: var(--screen-bg, #0f172a);
      color: #f8fafc;
      min-height: 100vh;
      padding-bottom: 60px;
      transition: background-color 0.3s ease;
    }
    /* Top Navigation Header */
    header {
      background-color: #1e293b;
      border-bottom: 1px solid #334155;
      padding: 16px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo {
      font-size: 1.25rem;
      font-weight: 700;
      color: #3b82f6;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .dashboard-container {
      max-width: 1200px;
      margin: 32px auto;
      padding: 0 24px;
      display: grid;
      grid-template-columns: 1fr 350px;
      gap: 24px;
    }
    .card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
    }
    .card h2 {
      font-size: 1.1rem;
      margin-bottom: 16px;
      color: #e2e8f0;
    }
    .control-group {
      margin-bottom: 16px;
    }
    .control-group label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      margin-bottom: 8px;
      color: #94a3b8;
    }
    .control-group select, .control-group input {
      width: 100%;
      padding: 10px 12px;
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #f8fafc;
      font-size: 0.95rem;
    }
    .preview-box {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      margin-top: 16px;
    }
    #previewSubtitle {
      display: inline-block;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 24px;
      font-weight: 700;
      color: #ffffff;
      background: rgba(0, 0, 0, 0.75);
      transition: all 0.2s ease;
    }
    .btn {
      background-color: #3b82f6;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      margin-top: 8px;
    }
    .btn:hover { background-color: #2563eb; }
  </style>
</head>
<body>

  <header>
    <div class="logo">AICaptions Dashboard</div>
    <div id="room-info" style="font-size: 0.9rem; color: #94a3b8;">Room: <span id="currentRoomId">-</span></div>
  </header>

  <div class="dashboard-container">
    <!-- Main Control Area -->
    <div>
      <div class="card">
        <h2>Live Subtitle Preview</h2>
        <div class="preview-box" id="previewScreen">
          <div id="previewSubtitle">Sample live caption text rendering here...</div>
        </div>
      </div>
    </div>

    <!-- Style & Background Customization Panel -->
    <div>
      <div class="card">
        <h2>Appearance Settings</h2>
        
        <!-- Screen Background Color / Chroma Key -->
        <div class="control-group">
          <label for="screenBgSelect">Screen Background</label>
          <select id="screenBgSelect" onchange="updateScreenBackground()">
            <option value="#0f172a">Dark Default (#0f172a)</option>
            <option value="transparent">Transparent</option>
            <option value="#00ff00">Green Screen (#00ff00)</option>
            <option value="#00b140">Chroma Green (#00b140)</option>
            <option value="#000000">Solid Black (#000000)</option>
          </select>
        </div>

        <!-- Subtitle Background Color / Opacity -->
        <div class="control-group">
          <label for="subBgSelect">Subtitle Background</label>
          <select id="subBgSelect" onchange="updateSubtitleBackground()">
            <option value="rgba(0, 0, 0, 0.75)">Semi-Transparent Black (75%)</option>
            <option value="rgba(0, 0, 0, 0.5)">Medium Black (50%)</option>
            <option value="rgba(0, 0, 0, 0.9)">Solid Dark (90%)</option>
            <option value="rgba(0, 128, 0, 0.8)">Green Screen Box</option>
            <option value="transparent">Transparent (No Background)</option>
            <option value="#000000">Solid Black</option>
          </select>
        </div>

        <button class="btn" onclick="saveAndBroadcastStyles()">Apply & Sync Styles</button>
      </div>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const roomId = urlParams.get('room') || 'main-stage';
    document.getElementById('currentRoomId').textContent = roomId;

    const previewSubtitle = document.getElementById('previewSubtitle');
    const previewScreen = document.getElementById('previewScreen');

    function updateScreenBackground() {
      const bgValue = document.getElementById('screenBgSelect').value;
      if (bgValue === 'transparent') {
        document.body.style.backgroundColor = 'transparent';
        previewScreen.style.backgroundColor = 'rgba(255,255,255,0.05)';
      } else {
        document.body.style.backgroundColor = bgValue;
        previewScreen.style.backgroundColor = bgValue;
      }
    }

    function updateSubtitleBackground() {
      const subBgValue = document.getElementById('subBgSelect').value;
      previewSubtitle.style.backgroundColor = subBgValue;
    }

    function saveAndBroadcastStyles() {
      const styles = {
        screenBg: document.getElementById('screenBgSelect').value,
        subtitleBg: document.getElementById('subBgSelect').value,
      };

      // Save to localStorage or broadcast via WebSocket/Supabase if configured
      localStorage.setItem(`aicaptions_styles_${roomId}`, JSON.stringify(styles));
      
      // Visual feedback
      alert('Styles updated successfully!');
    }

    // Load saved preferences on startup
    window.addEventListener('DOMContentLoaded', () => {
      const saved = localStorage.getItem(`aicaptions_styles_${roomId}`);
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          if (parsed.screenBg) {
            document.getElementById('screenBgSelect').value = parsed.screenBg;
            updateScreenBackground();
          }
          if (parsed.subtitleBg) {
            document.getElementById('subBgSelect').value = parsed.subtitleBg;
            updateSubtitleBackground();
          }
        } catch (e) {
          console.error("Error loading saved styles", e);
        }
      }
    });
  </script>
</body>
</html>
