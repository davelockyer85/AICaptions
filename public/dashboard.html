<script>
  let currentUser = null;
  let userAllowedRooms = 1;

  async function initDashboard() {
    // Check Supabase Authentication Session
    const { data: { session }, error } = await supabase.auth.getSession();
    if (error || !session) {
      window.location.href = '/index.html';
      return;
    }

    currentUser = session.user;
    const token = session.access_token;

    // Fetch user profile and room limit from Supabase
    const { data: profile } = await supabase
      .from('users')
      .select('allowed_rooms, streaming_seconds_used, max_streaming_seconds, plan_tier')
      .eq('id', currentUser.id)
      .single();

    userAllowedRooms = profile?.allowed_rooms ?? 1;

    // Update User Info Header / Meter Display
    document.getElementById('userEmail').innerText = currentUser.email;
    if (profile) {
      const usedMins = Math.round((profile.streaming_seconds_used || 0) / 60);
      const maxMins = profile.max_streaming_seconds ? Math.round(profile.max_streaming_seconds / 60) : '∞';
      document.getElementById('quotaDisplay').innerText = `Usage: ${usedMins} / ${maxMins} mins`;
    }

    loadUserRooms(token);
  }

  async function loadUserRooms(token) {
    const roomsContainer = document.getElementById('roomsGrid');
    roomsContainer.innerHTML = '';

    // Fetch active rooms for user
    const { data: rooms, error } = await supabase
      .from('rooms')
      .select('*')
      .eq('user_id', currentUser.id)
      .order('created_at', { ascending: false });

    if (error) {
      console.error('Error fetching rooms:', error);
      return;
    }

    const currentRoomCount = rooms ? rooms.length : 0;
    updateCreateRoomButton(currentRoomCount);

    if (currentRoomCount === 0) {
      roomsContainer.innerHTML = `<div class="empty-state"><p>No active stages found. Click "+ Create New Event Stage" to get started.</p></div>`;
      return;
    }

    rooms.forEach(room => {
      const presenterUrl = `${window.location.origin}/presenter.html?room=${encodeURIComponent(room.id)}&token=${encodeURIComponent(token)}`;
      const overlayUrl = `${window.location.origin}/overlay.html?room=${encodeURIComponent(room.id)}`;
      const audienceUrl = `${window.location.origin}/overlay.html?room=${encodeURIComponent(room.id)}`;

      const card = document.createElement('div');
      card.className = 'room-card';
      card.innerHTML = `
        <div class="room-header">
          <h3>${room.name || 'Untitled Event'}</h3>
          <span class="badge-room-id">ID: ${room.id}</span>
        </div>

        <div class="links-grid">
          <!-- Presenter Panel Link -->
          <div class="link-box">
            <label>Presenter Microphones Link</label>
            <div class="link-action">
              <input type="text" readonly value="${presenterUrl}" id="p_${room.id}">
              <button class="btn-copy" onclick="copyLink('p_${room.id}')">Copy</button>
            </div>
          </div>

          <!-- OBS Overlay Link -->
          <div class="link-box">
            <label>OBS Transparent Overlay Link</label>
            <div class="link-action">
              <input type="text" readonly value="${overlayUrl}" id="o_${room.id}">
              <button class="btn-copy" onclick="copyLink('o_${room.id}')">Copy</button>
            </div>
          </div>

          <!-- Mobile Audience View Link -->
          <div class="link-box">
            <label>Mobile Audience View Link</label>
            <div class="link-action">
              <input type="text" readonly value="${audienceUrl}" id="a_${room.id}">
              <button class="btn-copy" onclick="copyLink('a_${room.id}')">Copy</button>
            </div>
          </div>
        </div>

        <div class="room-footer">
          <button class="btn-delete" onclick="deleteRoom('${room.id}')">Delete Stage</button>
        </div>
      `;
      roomsContainer.appendChild(card);
    });
  }

  function updateCreateRoomButton(currentRoomCount) {
    const createBtn = document.getElementById('createRoomBtn');
    if (!createBtn) return;

    if (currentRoomCount >= userAllowedRooms) {
      createBtn.disabled = true;
      createBtn.innerText = `Stage Limit Reached (${currentRoomCount}/${userAllowedRooms})`;
      createBtn.title = "Upgrade your plan to create more simultaneous stages.";
    } else {
      createBtn.disabled = false;
      createBtn.innerText = "+ Create New Event Stage";
      createBtn.title = "";
    }
  }

  async function createRoom() {
    const roomName = prompt("Enter a name for your event/stage:");
    if (!roomName) return;

    const { data, error } = await supabase
      .from('rooms')
      .insert([{ name: roomName, user_id: currentUser.id }])
      .select();

    if (error) {
      alert("Failed to create stage: " + error.message);
    } else {
      const session = (await supabase.auth.getSession())?.data?.session;
      loadUserRooms(session?.access_token || '');
    }
  }

  async function deleteRoom(roomId) {
    if (!confirm("Are you sure you want to delete this event stage?")) return;

    const { error } = await supabase
      .from('rooms')
      .delete()
      .eq('id', roomId);

    if (error) {
      alert("Failed to delete stage: " + error.message);
    } else {
      const session = (await supabase.auth.getSession())?.data?.session;
      loadUserRooms(session?.access_token || '');
    }
  }

  function copyLink(inputId) {
    const copyText = document.getElementById(inputId);
    copyText.select();
    copyText.setSelectionRange(0, 99999);
    navigator.clipboard.writeText(copyText.value);
    alert("Copied link to clipboard!");
  }

  // Initialize on page load
  document.addEventListener('DOMContentLoaded', initDashboard);
</script>
