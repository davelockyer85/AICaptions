<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AICaptions - Event Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-blue: #0284c7;
      --accent-hover: #0369a1;
      --accent-green: #22c55e;
      --danger: #ef4444;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      margin: 0;
      padding: 0;
    }
    header {
      background: #182234;
      border-bottom: 1px solid var(--border-color);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header-info { display: flex; gap: 1rem; align-items: center; }
    .badge { background: #334155; padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.875rem; }
    .container { max-width: 1100px; margin: 2rem auto; padding: 0 1rem; }
    
    /* Usage Summary Cards */
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2rem;
    }
    .stat-card {
      background: var(--card-bg);
      padding: 1.25rem 1.5rem;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }
    .stat-label { font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); font-weight: 600; }
    .stat-value { font-size: 1.5rem; font-weight: bold; color: #38bdf8; margin: 0.5rem 0; }
    .stat-subtext { font-size: 0.85rem; color: var(--text-muted); }
    
    .progress-bar {
      width: 100%;
      height: 6px;
      background: #334155;
      border-radius: 3px;
      overflow: hidden;
      margin-top: 0.5rem;
    }
    .progress-fill {
      height: 100%;
      background: var(--accent-blue);
      width: 0%;
      transition: width 0.3s ease;
    }

    .action-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }
    button.btn-primary {
      background: var(--accent-blue);
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }
    button.btn-primary:disabled {
      background: #475569;
      cursor: not-allowed;
    }

    /* Grid & Cards */
    .rooms-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.5rem;
      margin-bottom: 3rem;
    }
    .room-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .room-header { display: flex; justify-content: space-between; align-items: center; }
    .room-header h3 { margin: 0; font-size: 1.25rem; color: #38bdf8; }
    .link-box { margin-top: 0.5rem; }
    .link-box label { font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); display: block; margin-bottom: 0.25rem; }
    .link-action { display: flex; gap: 0.5rem; }
    .link-action input {
      flex: 1;
      background: #0f172a;
      border: 1px solid var(--border-color);
      color: #38bdf8;
      padding: 0.5rem;
      border-radius: 4px;
      font-family: monospace;
      font-size: 0.85rem;
    }
    .btn-copy { background: #334155; color: white; border: none; padding: 0.5rem 0.75rem; border-radius: 4px; cursor: pointer; }
    .btn-delete { background: transparent; color: var(--danger); border: 1px solid var(--danger); padding: 0.5rem; border-radius: 4px; cursor: pointer; margin-top: 0.5rem; }
    
    /* Sessions Table */
    .table-container {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 3rem;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }
    th, td {
      padding: 0.875rem 1.25rem;
      border-bottom: 1px solid var(--border-color);
      font-size: 0.9rem;
    }
    th {
      background: #182234;
      color: var(--text-muted);
      text-transform: uppercase;
      font-size: 0.75rem;
    }
    tr:last-child td { border-bottom: none; }
    .status-active { color: var(--accent-green); font-weight: 600; }
    .status-completed { color: var(--text-muted); }

    .empty-state { text-align: center; color: var(--text-muted); padding: 3rem; background: var(--card-bg); border-radius: 8px; border: 1px dashed var(--border-color); }
  </style>
</head>
<body>

  <header>
    <h2>AICaptions Dashboard</h2>
    <div class="header-info">
      <span id="userEmail" class="badge">Loading...</span>
      <button onclick="logout()" style="background: transparent; border: 1px solid var(--border-color); color: white; padding: 0.4rem 0.8rem; border-radius: 4px; cursor: pointer;">Logout</button>
    </div>
  </header>

  <div class="container">
    <!-- Remaining Stats Bar -->
    <div class="stats-bar">
      <div class="stat-card">
        <div class="stat-label">Remaining Streaming Time</div>
        <div class="stat-value" id="remainingTimeDisplay">-- mins</div>
        <div class="stat-subtext" id="timeSubtext">Used 0 of 60 mins</div>
        <div class="progress-bar"><div class="progress-fill" id="timeProgress"></div></div>
      </div>

      <div class="stat-card">
        <div class="stat-label">Available Stages</div>
        <div class="stat-value" id="remainingRoomsDisplay">-- remaining</div>
        <div class="stat-subtext" id="roomSubtext">0 of 3 stages created</div>
        <div class="progress-bar"><div class="progress-fill" id="roomProgress"></div></div>
      </div>
    </div>

    <!-- Active Stages Section -->
    <div class="action-bar">
      <h2>Your Event Stages</h2>
      <button class="btn-primary" id="createRoomBtn" onclick="createRoom()">+ Create New Event Stage</button>
    </div>

    <div id="roomsGrid" class="rooms-grid">
      <div class="empty-state">Loading stages...</div>
    </div>

    <!-- Streaming Session History Table -->
    <div class="action-bar">
      <h2>Recent Streaming Sessions</h2>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Stage Name</th>
            <th>Started At</th>
            <th>Duration</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="sessionsTableBody">
          <tr><td colspan="4" style="text-align:center; color: var(--text-muted);">Loading sessions...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    var sbClient = null;
    var currentUser = null;
    var userLimits = { maxRooms: 3, maxSeconds: 3600, usedSeconds: 0, currentRoomCount: 0 };
    var activeToken = '';

    async function initDashboard() {
      if (window.supabaseClient) {
        sbClient = window.supabaseClient;
      } else if (typeof supabase !== 'undefined' && typeof supabase.createClient === 'function') {
        sbClient = supabase;
      } else if (typeof createClient !== 'undefined') {
        const supabaseUrl = 'https://YOUR_SUPABASE_PROJECT.supabase.co';
        const supabaseKey = 'YOUR_SUPABASE_ANON_KEY';
        sbClient = createClient(supabaseUrl, supabaseKey);
      }

      if (!sbClient) return;

      const { data: { session }, error } = await sbClient.auth.getSession();
      if (error || !session) {
        window.location.href = '/index.html';
        return;
      }

      currentUser = session.user;
      activeToken = session.access_token;
      document.getElementById('userEmail').innerText = currentUser.email;

      await fetchUserData();
      await loadUserRooms(activeToken);
      await loadSessions();
      setupRealtimeListeners();
    }

    async function fetchUserData() {
      const { data, error } = await sbClient
        .from('users')
        .select('*')
        .eq('id', currentUser.id)
        .single();

      if (!error && data) {
        userLimits.usedSeconds = data.streaming_seconds_used || 0;
        userLimits.maxSeconds = data.max_streaming_seconds || 3600;
        userLimits.maxRooms = data.max_rooms || 3;
      }
      updateStatsUI();
    }

    function updateStatsUI() {
      // 1. Calculate Time Remaining
      const remainingSecs = Math.max(0, userLimits.maxSeconds - userLimits.usedSeconds);
      const remainingMins = Math.floor(remainingSecs / 60);
      const usedMins = Math.round(userLimits.usedSeconds / 60);
      const maxMins = Math.round(userLimits.maxSeconds / 60);
      const timePercent = Math.min(100, (userLimits.usedSeconds / userLimits.maxSeconds) * 100);

      document.getElementById('remainingTimeDisplay').innerText = `${remainingMins} mins`;
      document.getElementById('timeSubtext').innerText = `Used ${usedMins} of ${maxMins} mins`;
      document.getElementById('timeProgress').style.width = `${timePercent}%`;

      // 2. Calculate Rooms Remaining
      const remainingRooms = Math.max(0, userLimits.maxRooms - userLimits.currentRoomCount);
      const roomPercent = Math.min(100, (userLimits.currentRoomCount / userLimits.maxRooms) * 100);

      document.getElementById('remainingRoomsDisplay').innerText = `${remainingRooms} slots`;
      document.getElementById('roomSubtext').innerText = `${userLimits.currentRoomCount} of ${userLimits.maxRooms} stages created`;
      document.getElementById('roomProgress').style.width = `${roomPercent}%`;

      const createBtn = document.getElementById('createRoomBtn');
      if (userLimits.currentRoomCount >= userLimits.maxRooms) {
        createBtn.disabled = true;
        createBtn.innerText = 'Stage Limit Reached';
      } else {
        createBtn.disabled = false;
        createBtn.innerText = '+ Create New Event Stage';
      }
    }

    async function loadUserRooms(token) {
      const roomsContainer = document.getElementById('roomsGrid');

      const { data: rooms, error } = await sbClient
        .from('rooms')
        .select('*')
        .eq('user_id', currentUser.id)
        .order('created_at', { ascending: false });

      if (error) {
        roomsContainer.innerHTML = `<div class="empty-state">Failed to load stages.</div>`;
        return;
      }

      userLimits.currentRoomCount = rooms ? rooms.length : 0;
      updateStatsUI();

      if (!rooms || rooms.length === 0) {
        roomsContainer.innerHTML = `<div class="empty-state"><p>No active stages. Click "+ Create New Event Stage" to get started.</p></div>`;
        return;
      }

      roomsContainer.innerHTML = '';
      rooms.forEach(room => {
        const presenterUrl = `${window.location.origin}/presenter.html?room=${encodeURIComponent(room.id)}&token=${encodeURIComponent(token)}`;
        const overlayUrl = `${window.location.origin}/overlay.html?room=${encodeURIComponent(room.id)}`;

        const card = document.createElement('div');
        card.className = 'room-card';
        card.innerHTML = `
          <div class="room-header">
            <h3>${room.name || 'Untitled Stage'}</h3>
            <span class="badge">ID: ${room.id.slice(0, 8)}...</span>
          </div>

          <div class="link-box">
            <label>Presenter Panel</label>
            <div class="link-action">
              <input type="text" readonly value="${presenterUrl}" id="p_${room.id}">
              <button class="btn-copy" onclick="copyLink('p_${room.id}')">Copy</button>
            </div>
          </div>

          <div class="link-box">
            <label>OBS Overlay Link</label>
            <div class="link-action">
              <input type="text" readonly value="${overlayUrl}" id="o_${room.id}">
              <button class="btn-copy" onclick="copyLink('o_${room.id}')">Copy</button>
            </div>
          </div>

          <button class="btn-delete" onclick="deleteRoom('${room.id}')">Delete Stage</button>
        `;
        roomsContainer.appendChild(card);
      });
    }

    async function loadSessions() {
      const tableBody = document.getElementById('sessionsTableBody');

      const { data: sessions, error } = await sbClient
        .from('sessions')
        .select('*')
        .eq('user_id', currentUser.id)
        .order('started_at', { ascending: false })
        .limit(10);

      if (error || !sessions || sessions.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="4" style="text-align:center; color: var(--text-muted);">No active or recent streaming sessions found.</td></tr>`;
        return;
      }

      tableBody.innerHTML = '';
      sessions.forEach(session => {
        const row = document.createElement('tr');
        const startDate = new Date(session.started_at).toLocaleString();
        const durationMins = Math.round((session.duration_seconds || 0) / 60);

        row.innerHTML = `
          <td><strong>${session.room_name || 'Main Stage'}</strong></td>
          <td>${startDate}</td>
          <td>${durationMins} mins</td>
          <td><span class="${session.status === 'active' ? 'status-active' : 'status-completed'}">${session.status.toUpperCase()}</span></td>
        `;
        tableBody.appendChild(row);
      });
    }

    function setupRealtimeListeners() {
      // 1. Rooms Live Sync
      sbClient.channel(`rooms_${currentUser.id}`)
        .on('postgres_changes', { event: '*', schema: 'public', table: 'rooms', filter: `user_id=eq.${currentUser.id}` }, () => loadUserRooms(activeToken))
        .subscribe();

      // 2. Profile Usage Live Sync
      sbClient.channel(`profile_${currentUser.id}`)
        .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'users', filter: `id=eq.${currentUser.id}` }, (payload) => {
          if (payload.new) {
            userLimits.usedSeconds = payload.new.streaming_seconds_used || 0;
            userLimits.maxSeconds = payload.new.max_streaming_seconds || 3600;
            userLimits.maxRooms = payload.new.max_rooms || 3;
            updateStatsUI();
          }
        })
        .subscribe();

      // 3. Sessions Live Table Sync
      sbClient.channel(`sessions_${currentUser.id}`)
        .on('postgres_changes', { event: '*', schema: 'public', table: 'sessions', filter: `user_id=eq.${currentUser.id}` }, () => loadSessions())
        .subscribe();
    }

    async function createRoom() {
      if (userLimits.currentRoomCount >= userLimits.maxRooms) {
        alert(`Stage limit reached (${userLimits.maxRooms} max). Delete a stage or upgrade your plan.`);
        return;
      }

      const roomName = prompt("Enter stage name:");
      if (!roomName) return;

      const { error } = await sbClient
        .from('rooms')
        .insert([{ name: roomName, user_id: currentUser.id }]);

      if (error) alert("Error creating stage: " + error.message);
    }

    async function deleteRoom(roomId) {
      if (!confirm("Are you sure you want to delete this stage?")) return;

      const { error } = await sbClient
        .from('rooms')
        .delete()
        .eq('id', roomId);

      if (error) alert("Error deleting stage: " + error.message);
    }

    function copyLink(inputId) {
      const copyText = document.getElementById(inputId);
      copyText.select();
      navigator.clipboard.writeText(copyText.value);
      alert("Link copied to clipboard!");
    }

    async function logout() {
      if (sbClient) await sbClient.auth.signOut();
      window.location.href = '/index.html';
    }

    document.addEventListener('DOMContentLoaded', initDashboard);
  </script>
</body>
</html>
