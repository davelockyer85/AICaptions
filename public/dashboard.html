<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - AICaptions</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    .card { background-color: #1e293b; border: 1px solid #334155; border-radius: 0.75rem; }
  </style>
</head>
<body class="min-h-screen p-6 md:p-10">

  <!-- Header -->
  <header class="max-w-6xl mx-auto flex justify-between items-center mb-8 pb-4 border-b border-slate-800">
    <div class="flex items-center gap-2">
      <span class="text-2xl">🎙️</span>
      <h1 class="text-2xl font-bold tracking-tight text-white">AICaptions</h1>
    </div>
    <div class="flex items-center gap-4">
      <span id="user-email" class="text-slate-400 text-sm">Loading user...</span>
      <a href="/pricing.html" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-white text-sm rounded-lg font-medium transition">Upgrade / Billing</a>
      <button id="signout-btn" class="px-4 py-2 bg-red-600/20 hover:bg-red-600/30 text-red-400 text-sm rounded-lg font-medium transition">Sign Out</button>
    </div>
  </header>

  <main class="max-w-6xl mx-auto space-y-8">
    
    <!-- Account Overview Cards (Clean & Focused) -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <!-- 1. Current Plan -->
      <div class="card p-6">
        <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Current Plan</span>
        <h2 id="plan-tier" class="text-3xl font-extrabold text-white mt-2">--</h2>
        <p id="plan-status" class="text-xs text-emerald-400 font-medium mt-1">Status: Active</p>
      </div>

      <!-- 2. Streaming Usage -->
      <div class="card p-6">
        <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Streaming Usage</span>
        <h2 id="usage-hours" class="text-3xl font-extrabold text-white mt-2">0.0 / 0 hrs</h2>
        <div class="w-full bg-slate-700 h-2 rounded-full mt-3 overflow-hidden">
          <div id="usage-bar" class="bg-blue-500 h-full w-0 transition-all duration-500"></div>
        </div>
        <p id="usage-percent" class="text-xs text-slate-400 mt-2">0% of quota used</p>
      </div>

      <!-- 3. Allowed Rooms -->
      <div class="card p-6">
        <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Allowed Rooms</span>
        <h2 id="allowed-rooms-count" class="text-3xl font-extrabold text-white mt-2">1 Stage(s)</h2>
        <p class="text-xs text-slate-400 mt-1">Simultaneous live streams</p>
      </div>
    </div>

    <!-- Rooms Console -->
    <section class="card p-6">
      <div class="flex justify-between items-center mb-6">
        <h3 class="text-xl font-bold text-white">Rooms & Live Stream Console</h3>
      </div>

      <!-- Room Cards Container -->
      <div id="rooms-container" class="space-y-4">
        <!-- Dynamic room cards will render here -->
      </div>
    </section>

  </main>

  <script>
    const SUPABASE_URL = "YOUR_SUPABASE_URL";
    const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function initDashboard() {
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) {
        window.location.href = "/login.html";
        return;
      }

      document.getElementById("user-email").innerText = session.user.email;

      // Fetch User Quota & Plan details
      const { data: profile } = await supabase
        .from("users")
        .select("*")
        .eq("id", session.user.id)
        .single();

      if (profile) {
        // Plan Info
        document.getElementById("plan-tier").innerText = (profile.plan_tier || "Free").toUpperCase();
        document.getElementById("plan-status").innerText = `Status: ${profile.subscription_status?.toUpperCase() || "ACTIVE"}`;

        // Quota & Hours Calculations
        const usedHrs = ((profile.streaming_seconds_used || 0) / 3600).toFixed(1);
        const maxHrs = ((profile.max_streaming_seconds || 18000) / 3600).toFixed(0);
        document.getElementById("usage-hours").innerText = `${usedHrs} / ${maxHrs} hrs`;

        const pct = Math.min(100, Math.round((usedHrs / maxHrs) * 100)) || 0;
        document.getElementById("usage-bar").style.width = `${pct}%`;
        document.getElementById("usage-percent").innerText = `${pct}% of monthly quota used`;

        // Rooms rendering (1 for Free/Starter, Multi for Higher Tiers)
        const roomCount = profile.allowed_rooms || 1;
        document.getElementById("allowed-rooms-count").innerText = `${roomCount} Stage(s)`;

        renderRooms(roomCount, session.access_token);
      }
    }

    function renderRooms(count, token) {
      const container = document.getElementById("rooms-container");
      container.innerHTML = "";

      for (let i = 1; i <= count; i++) {
        const roomId = i === 1 ? "main-stage" : `stage-${i}`;
        const roomCard = document.createElement("div");
        roomCard.className = "bg-slate-900/80 border border-slate-800 rounded-lg p-5 flex flex-col md:flex-row items-start md:items-center justify-between gap-4";

        roomCard.innerHTML = `
          <div>
            <div class="flex items-center gap-2">
              <span class="text-rose-500">📍</span>
              <h4 class="font-bold text-lg text-white">Stage: ${roomId}</h4>
            </div>
            <p class="text-xs text-slate-400 mt-0.5">Room ID: <code class="text-slate-300 font-mono">${roomId}</code></p>
          </div>

          <div class="flex flex-wrap items-center gap-3 w-full md:w-auto">
            <a href="/presenter.html?roomId=${roomId}&token=${token}" 
               target="_blank" 
               class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white font-medium rounded-lg text-sm transition flex items-center gap-1.5">
              <span>▶ Presenter View</span>
            </a>
            <a href="/overlay.html?roomId=${roomId}" 
               target="_blank" 
               class="px-4 py-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 font-medium rounded-lg text-sm transition flex items-center gap-1.5">
              <span>💻 Overlay View Link</span>
            </a>
            <a href="/mobile.html?roomId=${roomId}" 
               target="_blank" 
               class="px-4 py-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 font-medium rounded-lg text-sm transition flex items-center gap-1.5">
              <span>📱 Mobile Captions Link</span>
            </a>
          </div>
        `;
        container.appendChild(roomCard);
      }
    }

    document.getElementById("signout-btn").addEventListener("click", async () => {
      await supabase.auth.signOut();
      window.location.href = "/login.html";
    });

    initDashboard();
  </script>
</body>
</html>
