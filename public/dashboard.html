<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - AICaptions</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --border-color: #334155;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 1.25rem;
      font-weight: bold;
      color: var(--text-main);
      text-decoration: none;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    nav a {
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.2s;
    }

    nav a:hover, nav a.active {
      color: var(--text-main);
    }

    .btn-logout {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      cursor: pointer;
    }

    .btn-logout:hover {
      color: var(--text-main);
      border-color: var(--text-muted);
    }

    .container {
      max-width: 1000px;
      margin: 2rem auto;
      padding: 0 1.5rem;
      flex: 1;
      width: 100%;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.5rem;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 1rem;
      color: var(--text-muted);
    }

    .stat-value {
      font-size: 1.8rem;
      font-weight: bold;
      margin-bottom: 0.5rem;
    }

    .input-group {
      margin-bottom: 1.25rem;
    }

    .input-group label {
      display: block;
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    .input-group input {
      width: 100%;
      padding: 0.75rem;
      background: var(--bg-dark);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-main);
      font-size: 1rem;
    }

    .btn {
      width: 100%;
      padding: 0.85rem;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: background 0.2s;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-danger {
      background: var(--danger);
      color: #fff;
    }

    .btn-danger:hover {
      background: var(--danger-hover);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .caption-box {
      background: var(--bg-dark);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 1.25rem;
      min-height: 180px;
      max-height: 350px;
      overflow-y: auto;
      font-size: 1.1rem;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .interim {
      color: var(--text-muted);
      font-style: italic;
    }

    .status-badge {
      display: inline-block;
      padding: 0.25rem 0.6rem;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
    }

    .status-active { background: rgba(34, 197, 94, 0.2); color: #4ade80; }
    .status-inactive { background: rgba(239, 68, 68, 0.2); color: #fca5a5; }
  </style>
</head>
<body>

  <header>
    <a href="dashboard.html" class="logo">🎙️ AICaptions</a>
    <nav>
      <a href="dashboard.html" class="active">Dashboard</a>
      <a href="pricing.html">Pricing</a>
      <button class="btn-logout" onclick="handleLogout()">Sign Out</button>
    </nav>
  </header>

  <div class="container">
    <!-- User Account Status Grid -->
    <div class="grid">
      <div class="card">
        <div class="card-title">Account Email</div>
        <div id="userEmail" class="stat-value">Loading...</div>
      </div>
      <div class="card">
        <div class="card-title">Subscription Status</div>
        <div>
          <span id="subscriptionStatus" class="status-badge status-inactive">Checking...</span>
        </div>
      </div>
      <div class="card">
        <div class="card-title">Streaming Quota</div>
        <div id="quotaValue" class="stat-value">-- / --</div>
      </div>
    </div>

    <!-- Live Presenter Control Room -->
    <div class="card" style="margin-bottom: 2rem;">
      <div class="card-title">Broadcaster Control</div>
      
      <div class="input-group">
        <label for="roomIdInput">Room Name / ID</label>
        <input type="text" id="roomIdInput" value="main-stage" placeholder="e.g. main-stage">
      </div>

      <div style="display: flex; gap: 1rem; margin-bottom: 1.5rem;">
        <button id="startBtn" class="btn btn-primary" onclick="startPresenterStream()">Start Live Stream</button>
        <button id="stopBtn" class="btn btn-danger" onclick="stopPresenterStream()" style="display: none;">Stop Stream</button>
      </div>

      <div class="card-title">Live Preview Captions</div>
      <div id="captionPreview" class="caption-box">Captions will appear here when you speak...</div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://euopdmwtowuxdzczwbul.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV1b3BkbXd0b3d1eGR6Y3p3YnVsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxNjI4NTIsImV4cCI6MjEwNTczODg1Mn0.PdQMQ4RmEjtkY23eu8bSGpCVhDw1kal66aOKv7uzYkw";

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let activeWebSocket = null;
    let activeMediaRecorder = null;
    let activeAudioStream = null;
    let finalCaptionsText = "";

    // Load User Profile on Page Mount
    document.addEventListener("DOMContentLoaded", async () => {
      const { data: { session }, error } = await supabase.auth.getSession();

      if (error || !session) {
        window.location.href = "auth.html";
        return;
      }

      document.getElementById("userEmail").innerText = session.user.email;

      // Query Database Account Limits
      const { data: userProfile } = await supabase
        .from("users")
        .select("*")
        .eq("id", session.user.id)
        .single();

      if (userProfile) {
        const isSubActive = userProfile.subscription_status === "active";
        const isPassValid = userProfile.one_time_expires_at && new Date(userProfile.one_time_expires_at) > new Date();

        const statusBadge = document.getElementById("subscriptionStatus");
        if (isSubActive || isPassValid) {
          statusBadge.innerText = isSubActive ? "Active Subscription" : "Valid Event Pass";
          statusBadge.className = "status-badge status-active";
        } else {
          statusBadge.innerText = "Inactive";
          statusBadge.className = "status-badge status-inactive";
        }

        const maxSecs = Number(userProfile.max_streaming_seconds) || 7200;
        const usedSecs = Number(userProfile.streaming_seconds_used) || 0;
        const maxMins = Math.round(maxSecs / 60);
        const usedMins = Math.round(usedSecs / 60);

        document.getElementById("quotaValue").innerText = `${usedMins} / ${maxMins} mins`;
      }
    });

    async function startPresenterStream() {
      const startBtn = document.getElementById("startBtn");
      const stopBtn = document.getElementById("stopBtn");
      const roomId = document.getElementById("roomIdInput").value.trim() || "main-stage";
      const previewBox = document.getElementById("captionPreview");

      startBtn.disabled = true;
      startBtn.innerText = "Connecting...";

      try {
        // 1. Fetch Auth Token
        const { data: { session } } = await supabase.auth.getSession();
        if (!session) {
          alert("Session expired. Please log in again.");
          window.location.href = "auth.html";
          return;
        }

        // 2. Request Microphone Access
        try {
          activeAudioStream = await navigator.mediaDevices.getUserMedia({
            audio: { channelCount: 1, sampleRate: 16000, echoCancellation: true }
          });
        } catch (mediaErr) {
          console.error("Microphone Access Error:", mediaErr);
          if (mediaErr.name === 'NotAllowedError') {
            alert("Microphone permission denied. Please allow mic access in your browser settings.");
          } else if (mediaErr.name === 'NotFoundError') {
            alert("No microphone found. Please connect a mic and try again.");
          } else {
            alert(`Microphone Error: ${mediaErr.message}`);
          }
          resetUIButtons();
          return;
        }

        // 3. Construct Correct WebSocket URL
        const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
        const wsUrl = `${protocol}//${window.location.host}?role=presenter&roomId=${encodeURIComponent(roomId)}&token=${encodeURIComponent(session.access_token)}`;

        activeWebSocket = new WebSocket(wsUrl);

        activeWebSocket.onopen = () => {
          console.log("Presenter WebSocket connected successfully.");
          startBtn.style.display = "none";
          stopBtn.style.display = "block";
          startBtn.innerText = "Start Live Stream";
          startBtn.disabled = false;

          // Initialize MediaRecorder
          let mimeType = "audio/webm";
          if (!MediaRecorder.isTypeSupported("audio/webm")) {
            mimeType = "audio/mp4";
          }

          activeMediaRecorder = new MediaRecorder(activeAudioStream, { mimeType });

          activeMediaRecorder.ondataavailable = (event) => {
            if (event.data.size > 0 && activeWebSocket && activeWebSocket.readyState === WebSocket.OPEN) {
              activeWebSocket.send(event.data);
            }
          };

          activeMediaRecorder.start(250);
        };

        activeWebSocket.onmessage = (event) => {
          try {
            const data = JSON.parse(event.data);
            if (data.type === "error") {
              alert(`Stream Rerejected: ${data.message}`);
              stopPresenterStream();
            } else if (data.type === "transcript") {
              if (data.isFinal) {
                finalCaptionsText += data.text + " ";
                previewBox.innerText = finalCaptionsText;
              } else {
                previewBox.innerHTML = `${finalCaptionsText}<span class="interim">${data.text}</span>`;
              }
              previewBox.scrollTop = previewBox.scrollHeight;
            }
          } catch (e) {
            console.error("Error parsing message:", e);
          }
        };

        activeWebSocket.onclose = (event) => {
          console.warn(`WebSocket closed — Code: ${event.code}, Reason: ${event.reason}`);
          stopPresenterStream();
          if (event.code !== 1000) {
            alert(`Stream Closed (${event.code}): ${event.reason || "Connection lost"}`);
          }
        };

        activeWebSocket.onerror = (err) => {
          console.error("WebSocket Error:", err);
        };

      } catch (err) {
        console.error("Failed to start presenter stream:", err);
        alert("Server connection failed.");
        resetUIButtons();
      }
    }

    function stopPresenterStream() {
      if (activeMediaRecorder && activeMediaRecorder.state !== "inactive") {
        activeMediaRecorder.stop();
      }
      if (activeAudioStream) {
        activeAudioStream.getTracks().forEach(track => track.stop());
      }
      if (activeWebSocket && activeWebSocket.readyState === WebSocket.OPEN) {
        activeWebSocket.close(1000, "User stopped stream");
      }

      resetUIButtons();
    }

    function resetUIButtons() {
      const startBtn = document.getElementById("startBtn");
      const stopBtn = document.getElementById("stopBtn");
      startBtn.style.display = "block";
      stopBtn.style.display = "none";
      startBtn.innerText = "Start Live Stream";
      startBtn.disabled = false;
    }

    async function handleLogout() {
      await supabase.auth.signOut();
      window.location.href = "auth.html";
    }
  </script>

</body>
</html>
