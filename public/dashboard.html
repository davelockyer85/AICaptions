<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Stage Captions SaaS</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 0;
    }
    .header {
      background-color: #1e293b;
      border-bottom: 1px solid #334155;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header h1 {
      font-size: 1.25rem;
      margin: 0;
      color: #60a5fa;
    }
    .user-info {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .btn-logout {
      background: #334155;
      color: #f8fafc;
      border: none;
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn-logout:hover { background: #475569; }
    
    .container {
      max-width: 1000px;
      margin: 2rem auto;
      padding: 0 1rem;
    }
    
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .stat-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 1.25rem;
    }
    .stat-title {
      font-size: 0.85rem;
      color: #94a3b8;
      text-transform: uppercase;
      font-weight: 600;
    }
    .stat-value {
      font-size: 1.75rem;
      font-weight: 700;
      margin-top: 0.5rem;
      color: #f8fafc;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }
    .btn-primary {
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-primary:hover { background-color: #1d4ed8; }

    .room-card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }
    .room-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }
    .room-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: #f8fafc;
    }
    .room-id {
      font-family: monospace;
      color: #60a5fa;
      background: #0f172a;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
    }

    .links-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-top: 1rem;
    }
    @media(max-width: 640px) {
      .links-grid { grid-template-columns: 1fr; }
    }
    .link-box {
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 12px 16px;
    }
    .link-box label {
      display: block;
      font-size: 0.75rem;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .link-action {
      display: flex;
      gap: 8px;
    }
    .link-action input {
      flex: 1;
      background: none;
      border: none;
      color: #cbd5e1;
      font-size: 0.85rem;
      outline: none;
      font-family: monospace;
    }
    .btn-copy {
      background-color: #334155;
      color: #3b82f6;
      border: none;
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-copy:hover { background-color: #475569; }

    /* Modal Styling */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 2rem;
      width: 100%;
      max-width: 400px;
    }
    .modal h2 { margin-top: 0; font-size: 1.25rem; }
    .form-group { margin-bottom: 1.25rem; }
    .form-group label { display: block; font-size: 0.85rem; color: #94a3b8; margin-bottom: 0.5rem; }
    .form-group input {
      width: 100%;
      padding: 0.6rem 0.8rem;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #f8fafc;
      outline: none;
    }
    .modal-actions { display: flex; gap: 0.5rem; justify-content: flex-end; }
    .btn-cancel { background: #334155; color: #f8fafc; border: none; padding: 0.6rem 1rem; border-radius: 6px; cursor: pointer; }
  </style>
</head>
<body>

  <header class="header">
    <h1>AICaptions Dashboard</h1>
    <div class="user-info">
      <span id="userEmail" style="color: #94a3af; font-size: 0.9rem;">Loading...</span>
      <button class="btn-logout" id="logoutBtn">Log Out</button>
    </div>
  </header>

  <div class="container">
    <!-- Stats Banner -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-title">Active Rooms</div>
        <div class="stat-value" id="roomCount">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-title">Streaming Time Used</div>
        <div class="stat-value" id="timeUsed">0m</div>
      </div>
      <div class="stat-card">
        <div class="stat-title">Sync Status</div>
        <div class="stat-value" id="syncStatus" style="font-size: 1rem; color: #10b981; margin-top: 0.8rem;">● Live Realtime</div>
      </div>
    </div>

    <!-- Rooms Section Header -->
    <div class="section-header">
      <h2 style="margin: 0; font-size: 1.25rem;">Your Stages & Rooms</h2>
      <button class="btn-primary" id="openModalBtn">+ Create New Room</button>
    </div>

    <!-- Rooms Container -->
    <div id="roomsContainer">
      <p style="color: #94a3b8;">Loading stage rooms...</p>
    </div>
  </div>

  <!-- Create Room Modal -->
  <div class="modal-overlay" id="eventModal">
    <div class="modal">
      <h2>Create Stage Room</h2>
      <div class="form-group">
        <label for="eventNameInput">Event or Room Name</label>
        <input type="text" id="eventNameInput" placeholder="e.g., Main Auditorium Stage">
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" id="cancelModalBtn">Cancel</button>
        <button class="btn-primary" id="createEventBtn">Create Room</button>
      </div>
    </div>
  </div>

  <script>
    // 1. Initialize Supabase Client
    const SUPABASE_URL = window.location.origin.includes('localhost') 
      ? 'http://localhost:54321' 
      : (window.SUPABASE_URL || 'https://YOUR_SUPABASE_PROJECT.supabase.co');
    const SUPABASE_ANON_KEY = window.SUPABASE_ANON_KEY || 'YOUR_SUPABASE_ANON_KEY';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null;
    let realtimeChannel = null;

    // 2. Authentication Check & Setup
    async function initAuth() {
      const { data: { session }, error } = await supabaseClient.auth.getSession();
      
      if (error || !session) {
        window.location.href = '/login.html';
        return;
      }

      currentUser = session.user;
      document.getElementById('userEmail').innerText = currentUser.email;

      // Load initial data
      await loadDashboardData();

      // Subscribe to live database updates
      setupRealtimeSubscriptions();
    }

    // 3. Fetch Rooms & Stats from Supabase
    async function loadDashboardData() {
      if (!currentUser) return;

      const { data: rooms, error } = await supabaseClient
        .from('rooms')
        .select('*')
        .eq('user_id', currentUser.id)
        .order('created_at', { ascending: false });

      if (error) {
        console.error("Error fetching rooms:", error.message);
        document.getElementById('roomsContainer').innerHTML = `<p style="color: #ef4444;">Failed to load rooms: ${error.message}</p>`;
        return;
      }

      renderRooms(rooms || []);
      updateStats(rooms || []);
    }

    // 4. Render Rooms & Share Links
    function renderRooms(rooms) {
      const container = document.getElementById('roomsContainer');
      if (rooms.length === 0) {
        container.innerHTML = `<p style="color: #94a3b8; text-align: center; padding: 2rem; background: #1e293b; border-radius: 8px;">No active rooms found. Click "+ Create New Room" to get started.</p>`;
        return;
      }

      const baseUrl = window.location.origin;

      container.innerHTML = rooms.map(room => {
        const presenterUrl = `${baseUrl}/presenter.html?room=${encodeURIComponent(room.room_id)}`;
        const captionsUrl = `${baseUrl}/captions.html?room=${encodeURIComponent(room.room_id)}`;

        return `
          <div class="room-card" data-room-id="${room.room_id}">
            <div class="room-card-header">
              <span class="room-title">${escapeHtml(room.name || 'Untitled Room')}</span>
              <span class="room-id">${escapeHtml(room.room_id)}</span>
            </div>
            
            <div class="links-grid">
              <div class="link-box">
                <label>Presenter Ingest URL</label>
                <div class="link-action">
                  <input type="text" readonly value="${presenterUrl}">
                  <button class="btn-copy" onclick="copyToClipboard('${presenterUrl}', this)">Copy</button>
                </div>
              </div>

              <div class="link-box">
                <label>Live Captions Display URL</label>
                <div class="link-action">
                  <input type="text" readonly value="${captionsUrl}">
                  <button class="btn-copy" onclick="copyToClipboard('${captionsUrl}', this)">Copy</button>
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    // 5. Update Usage & Stats Cards
    function updateStats(rooms) {
      document.getElementById('roomCount').innerText = rooms.length;
      
      const totalSeconds = rooms.reduce((acc, r) => acc + (r.streaming_seconds_used || 0), 0);
      const totalMinutes = Math.floor(totalSeconds / 60);
      document.getElementById('timeUsed').innerText = `${totalMinutes}m ${totalSeconds % 60}s`;
    }

    // 6. Supabase Realtime Subscription (Live Sync Engine)
    function setupRealtimeSubscriptions() {
      if (realtimeChannel) {
        supabaseClient.removeChannel(realtimeChannel);
      }

      const syncStatus = document.getElementById('syncStatus');

      realtimeChannel = supabaseClient
        .channel(`dashboard-live-${currentUser.id}`)
        .on(
          'postgres_changes',
          {
            event: '*',
            schema: 'public',
            table: 'rooms',
            filter: `user_id=eq.${currentUser.id}`
          },
          (payload) => {
            console.log('Realtime change detected in rooms:', payload);
            loadDashboardData();
          }
        )
        .subscribe((status) => {
          if (status === 'SUBSCRIBED') {
            syncStatus.innerHTML = '● Live Realtime Sync';
            syncStatus.style.color = '#10b981';
          } else if (status === 'CLOSED' || status === 'CHANNEL_ERROR') {
            syncStatus.innerHTML = '○ Reconnecting...';
            syncStatus.style.color = '#f59e0b';
          }
        });
    }

    // 7. Create Room Logic
    const openModalBtn = document.getElementById('openModalBtn');
    const cancelModalBtn = document.getElementById('cancelModalBtn');
    const createEventBtn = document.getElementById('createEventBtn');
    const eventModal = document.getElementById('eventModal');
    const eventNameInput = document.getElementById('eventNameInput');

    openModalBtn.onclick = () => { eventModal.style.display = 'flex'; eventNameInput.focus(); };
    cancelModalBtn.onclick = () => { eventModal.style.display = 'none'; eventNameInput.value = ''; };

    createEventBtn.onclick = async () => {
      const name = eventNameInput.value.trim();
      if (!name) return;

      const roomId = 'evt_' + Math.random().toString(36).substring(2, 9);

      const { data, error } = await supabaseClient
        .from('rooms')
        .insert([
          {
            room_id: roomId,
            name: name,
            user_id: currentUser.id,
            streaming_seconds_used: 0
          }
        ]);

      if (error) {
        alert("Failed to create room: " + error.message);
      } else {
        eventNameInput.value = '';
        eventModal.style.display = 'none';
        await loadDashboardData();
      }
    };

    // Helper Functions
    function copyToClipboard(text, btn) {
      navigator.clipboard.writeText(text).then(() => {
        const origText = btn.innerText;
        btn.innerText = 'Copied!';
        btn.style.backgroundColor = '#10b981';
        btn.style.color = '#ffffff';
        setTimeout(() => {
          btn.innerText = origText;
          btn.style.backgroundColor = '#334155';
          btn.style.color = '#3b82f6';
        }, 1500);
      });
    }

    function escapeHtml(str) {
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    document.getElementById('logoutBtn').onclick = async () => {
      await supabaseClient.auth.signOut();
      window.location.href = '/login.html';
    };

    // Initialize Dashboard
    document.addEventListener('DOMContentLoaded', initAuth);
  </script>
</body>
</html>
