<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Stage Captions SaaS</title>

  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- QRCode.js CDN for audience QR code generation -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      padding-bottom: 60px;
    }

    /* Top Navigation Header */
    header {
      background-color: #1e293b;
      border-bottom: 1px solid #334155;
      padding: 16px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 1.25rem;
      font-weight: 700;
      color: #3b82f6;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .user-controls {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .user-email {
      font-size: 0.9rem;
      color: #94a3b8;
    }

    .btn-secondary {
      background-color: #334155;
      color: #f8fafc;
      border: 1px solid #475569;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-secondary:hover { background-color: #475569; }

    /* Main Container */
    .container {
      max-width: 1000px;
      margin: 40px auto;
      padding: 0 20px;
    }

    /* Subscription Status Banner */
    .status-card {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }

    .status-info h2 { font-size: 1.2rem; margin-bottom: 4px; }
    .status-info p { color: #94a3b8; font-size: 0.9rem; }

    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      margin-left: 8px;
    }

    .badge-active { background-color: rgba(34, 197, 94, 0.2); color: #22c55e; border: 1px solid rgba(34, 197, 94, 0.3); }

    .btn-primary {
      background-color: #3b82f6;
      color: #ffffff;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-primary:hover { background-color: #2563eb; }

    /* Events Section */
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .section-header h3 { font-size: 1.25rem; font-weight: 700; }

    .event-card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 20px;
    }

    .event-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #334155;
    }

    .event-title { font-size: 1.1rem; font-weight: 600; color: #f8fafc; }
    .event-id { font-size: 0.85rem; color: #64748b; font-family: monospace; }

    .links-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
    }

    .link-box {
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 12px 16px;
    }

    .link-box label {
      display: block;
      font-size: 0.75rem;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .link-action {
      display: flex;
      gap: 8px;
    }

    .link-action input {
      flex: 1;
      background: none;
      border: none;
      color: #cbd5e1;
      font-size: 0.85rem;
      outline: none;
      font-family: monospace;
    }

    .btn-copy {
      background-color: #334155;
      color: #3b82f6;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-copy:hover { background-color: #475569; color: #ffffff; }

    /* Modal for Event Creation */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(0, 0, 0, 0.75);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 28px;
      width: 100%;
      max-width: 400px;
    }

    .modal-card h3 { margin-bottom: 16px; }

    .modal-card input {
      width: 100%;
      padding: 10px 14px;
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #f8fafc;
      font-size: 0.95rem;
      margin-bottom: 20px;
      outline: none;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
    }

    /* QR Code Canvas Container */
    .qr-container {
      margin-top: 12px;
      text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">🎙️ Stage Captions</div>
    <div class="user-controls">
      <span class="user-email" id="userEmail">Loading...</span>
      <button class="btn-secondary" id="logoutBtn">Sign Out</button>
    </div>
  </header>

  <div class="container">
    
    <!-- Subscription Status Card -->
    <div class="status-card">
      <div class="status-info">
        <h2>Subscription Status <span class="badge badge-active">Active Pro Plan</span></h2>
        <p>Your subscription includes unlimited real-time rooms and OBS streaming.</p>
      </div>
      <button class="btn-secondary" onclick="window.location.href='/pricing.html'">Manage Plan</button>
    </div>

    <!-- Events Management Header -->
    <div class="section-header">
      <h3>Active Event Rooms</h3>
      <button class="btn-primary" id="openModalBtn">+ Create New Event</button>
    </div>

    <!-- Events List Container -->
    <div id="eventsContainer">
      <!-- Event cards will be dynamically injected here -->
    </div>

  </div>

  <!-- Create Event Modal -->
  <div class="modal-overlay" id="eventModal">
    <div class="modal-card">
      <h3>Create Event Room</h3>
      <label style="display:block; font-size:0.85rem; color:#cbd5e1; margin-bottom:6px;">Event Name</label>
      <input type="text" id="eventNameInput" placeholder="e.g. Keynote 2026" autofocus>
      <div class="modal-actions">
        <button class="btn-secondary" id="closeModalBtn">Cancel</button>
        <button class="btn-primary" id="createEventBtn">Create</button>
      </div>
    </div>
  </div>

  <script>
     
  // 1. Supabase Initialization
  const SUPABASE_URL = 'https://euopdmwtowuxdzczwbul.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_UQHJUuyX1-nHwpJ6ilgD7g_BZ0vNUWB';
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // UI Elements
  const userEmailSpan = document.getElementById('userEmail');
  const userPlanSpan = document.getElementById('userPlan');             // Make sure this ID exists in HTML
  const userUsageSpan = document.getElementById('userUsage');           // Make sure this ID exists in HTML
  const logoutBtn = document.getElementById('logoutBtn');
  const eventsContainer = document.getElementById('eventsContainer');
  
  const eventModal = document.getElementById('eventModal');
  const openModalBtn = document.getElementById('openModalBtn');
  const closeModalBtn = document.getElementById('closeModalBtn');
  const createEventBtn = document.getElementById('createEventBtn');
  const eventNameInput = document.getElementById('eventNameInput');

  let currentUser = null;
  let realtimeChannel = null;

  // 2. Auth Session Protection & App Init
  async function checkUserSession() {
    const { data: { session }, error } = await supabaseClient.auth.getSession();
    
    if (error || !session) {
      window.location.href = '/auth.html';
      return;
    }

    currentUser = session.user;
    if (userEmailSpan) userEmailSpan.innerText = currentUser.email;

    // Load account details and rooms
    await loadUserProfile();
    await loadUserEvents();

    // Subscribe to live usage updates from server.js background increments
    subscribeToLiveUserUpdates();
  }

  // 3. Load Subscription & Account Details from Supabase
  async function loadUserProfile() {
    if (!currentUser) return;

    try {
      const { data: profile, error } = await supabaseClient
        .from('users')
        .select('plan_tier, streaming_seconds_used, max_streaming_seconds, allowed_rooms, event_pass_expires_at')
        .eq('id', currentUser.id)
        .single();

      if (error) throw error;

      if (profile) {
        renderSubscriptionUI(profile);
      }
    } catch (err) {
      console.warn("Could not load user profile from Supabase:", err.message);
    }
  }

  // Helper to format and display subscription stats in dashboard header
  function renderSubscriptionUI(profile) {
    const planTier = (profile.plan_tier || 'free').toUpperCase();
    const usedMins = Math.floor((profile.streaming_seconds_used || 0) / 60);
    const maxMins = profile.max_streaming_seconds != null ? Math.floor(profile.max_streaming_seconds / 60) : 'Unlimited';

    if (userPlanSpan) userPlanSpan.innerText = `Plan: ${planTier}`;
    if (userUsageSpan) userUsageSpan.innerText = `Usage: ${usedMins} / ${maxMins} mins`;
  }

  // 4. Realtime Subscription for Live Usage Syncing
  function subscribeToLiveUserUpdates() {
    if (!currentUser) return;

    realtimeChannel = supabaseClient
      .channel(`public:users:id=eq.${currentUser.id}`)
      .on(
        'postgres_changes',
        {
          event: 'UPDATE',
          schema: 'public',
          table: 'users',
          filter: `id=eq.${currentUser.id}`
        },
        (payload) => {
          if (payload.new) {
            renderSubscriptionUI(payload.new);
          }
        }
      )
      .subscribe();
  }

  // Sign Out Handler
  logoutBtn.addEventListener('click', async () => {
    if (realtimeChannel) supabaseClient.removeChannel(realtimeChannel);
    await supabaseClient.auth.signOut();
    window.location.href = '/auth.html';
  });

  // Modal Controls
  openModalBtn.addEventListener('click', () => { eventModal.style.display = 'flex'; });
  closeModalBtn.addEventListener('click', () => { eventModal.style.display = 'none'; });

  // 5. Create Room Handler (Fixes NOT NULL constraint error)
  createEventBtn.addEventListener('click', async () => {
    const name = eventNameInput.value.trim();
    if (!name) return;

    const roomId = 'evt_' + Math.random().toString(36).substring(2, 9);

    try {
      // Pass streaming_seconds_used explicitly to satisfy NOT NULL column constraint
      const { error } = await supabaseClient.from('rooms').insert([
        { 
          room_id: roomId, 
          name: name, 
          user_id: currentUser.id,
          streaming_seconds_used: 0 
        }
      ]);

      if (error) throw error;

    } catch (e) {
      console.warn("Supabase room insert failed, falling back to local storage:", e.message);
      
      // Local fallback
      let localRooms = JSON.parse(localStorage.getItem('user_rooms') || '[]');
      localRooms.unshift({ id: roomId, name: name, created_at: new Date().toISOString() });
      localStorage.setItem('user_rooms', JSON.stringify(localRooms));
    }

    eventNameInput.value = '';
    eventModal.style.display = 'none';
    await loadUserEvents();
  });

  // 6. Fetch & Render Rooms (Supabase primary, LocalStorage fallback)
  async function loadUserEvents() {
    const origin = window.location.origin;
    let rooms = [];

    try {
      const { data: dbRooms, error } = await supabaseClient
        .from('rooms')
        .select('*')
        .eq('user_id', currentUser.id)
        .order('created_at', { ascending: false });

      if (!error && dbRooms && dbRooms.length > 0) {
        rooms = dbRooms.map(r => ({ id: r.room_id || r.id, name: r.name }));
      }
    } catch (err) {
      console.warn("Using local room state fallback:", err.message);
    }

    // Fallback to localStorage if no DB rooms returned
    if (rooms.length === 0) {
      rooms = JSON.parse(localStorage.getItem('user_rooms') || '[]');
    }

    // Default room if completely empty
    if (rooms.length === 0) {
      rooms = [{ id: 'main-stage', name: 'Main Stage Live Captions' }];
      localStorage.setItem('user_rooms', JSON.stringify(rooms));
    }

    eventsContainer.innerHTML = '';

    rooms.forEach((room) => {
      const presenterUrl = `${origin}/presenter.html?room=${room.id}`;
      const overlayUrl = `${origin}/overlay.html?room=${room.id}`;
      const audienceUrl = `${origin}/index.html?room=${room.id}`;

      const card = document.createElement('div');
      card.className = 'event-card';
      card.innerHTML = `
        <div class="event-card-header">
          <div>
            <div class="event-title">${room.name}</div>
            <div class="event-id">Room ID: ${room.id}</div>
          </div>
          <button class="btn-secondary" onclick="deleteRoom('${room.id}')">Delete</button>
        </div>

        <div class="links-grid">
          <div class="link-box">
            <label>Presenter Microphones Link</label>
            <div class="link-action">
              <input type="text" readonly value="${presenterUrl}" id="p_${room.id}">
              <button class="btn-copy" onclick="copyLink('p_${room.id}')">Copy</button>
            </div>
          </div>

          <div class="link-box">
            <label>OBS Transparent Overlay Link</label>
            <div class="link-action">
              <input type="text" readonly value="${overlayUrl}" id="o_${room.id}">
              <button class="btn-copy" onclick="copyLink('o_${room.id}')">Copy</button>
            </div>
          </div>

          <div class="link-box">
            <label>Mobile Audience View Link</label>
            <div class="link-action">
              <input type="text" readonly value="${audienceUrl}" id="a_${room.id}">
              <button class="btn-copy" onclick="copyLink('a_${room.id}')">Copy</button>
            </div>
          </div>
        </div>
      `;

      eventsContainer.appendChild(card);
    });
  }

  // Copy Link Helper
  function copyLink(inputId) {
    const input = document.getElementById(inputId);
    input.select();
    navigator.clipboard.writeText(input.value);
    alert("Link copied to clipboard!");
  }

  // Delete Room Helper
  async function deleteRoom(roomId) {
    try {
      await supabaseClient
        .from('rooms')
        .delete()
        .eq('room_id', roomId)
        .eq('user_id', currentUser.id);
    } catch (e) {
      console.warn("Could not delete room from Supabase:", e.message);
    }

    let localRooms = JSON.parse(localStorage.getItem('user_rooms') || '[]');
    localRooms = localRooms.filter(r => r.id !== roomId);
    localStorage.setItem('user_rooms', JSON.stringify(localRooms));
    await loadUserEvents();
  }

  // Execute Init
  checkUserSession();
</script>
