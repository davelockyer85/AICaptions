<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - AICaptions</title>

  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- QRCode.js CDN for audience QR code generation -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      padding-bottom: 60px;
    }

    /* Top Navigation Header */
    header {
      background-color: #1e293b;
      border-bottom: 1px solid #334155;
      padding: 16px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 1.25rem;
      font-weight: 700;
      color: #3b82f6;
    }

    .container {
      max-width: 900px;
      margin: 32px auto;
      padding: 0 20px;
    }

    .card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
    }

    h2, h3 {
      color: #f8fafc;
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 6px;
      color: #94a3b8;
    }

    select, input[type="text"], input[type="range"] {
      width: 100%;
      padding: 10px;
      background: #0f172a;
      color: #f8fafc;
      border: 1px solid #334155;
      border-radius: 6px;
      margin-bottom: 16px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
    }

    .checkbox-group {
      display: flex;
      gap: 24px;
      margin-top: 8px;
    }

    .checkbox-group label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      color: #f8fafc;
    }

    button {
      background-color: #3b82f6;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      background-color: #2563eb;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">AICaptions Dashboard</div>
    <div id="user-info">Loading...</div>
  </header>

  <div class="container">
    
    <!-- Room & Settings Card -->
    <div class="card">
      <h2>Session Settings</h2>
      <div class="grid-2">
        <div>
          <label for="roomInput">Room ID</label>
          <input type="text" id="roomInput" value="evt_cwaidse">
        </div>
        <div>
          <label for="langSelect">Target Translation Language</label>
          <select id="langSelect" onchange="updateLanguage()">
            <option value="en">English (Default)</option>
            <option value="es">Spanish</option>
            <option value="fr">French</option>
            <option value="de">German</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Overlay Style Controls Card -->
    <div class="card">
      <h3>Overlay Style Controls</h3>
      
      <div class="grid-2">
        <div>
          <label>Font Size (<span id="fontSizeVal">32</span>px)</label>
          <input type="range" id="fontSizeInput" min="16" max="96" value="32" oninput="document.getElementById('fontSizeVal').innerText = this.value" onchange="updateStyles()">
        </div>

        <div>
          <label>Font Family</label>
          <select id="fontFamilyInput" onchange="updateStyles()">
            <option value="sans-serif">Sans-Serif</option>
            <option value="serif">Serif</option>
            <option value="monospace">Monospace</option>
            <option value="'Bungee', cursive">Bungee (Display)</option>
          </select>
        </div>

        <div>
          <label>Animation</label>
          <select id="animationInput" onchange="updateStyles()">
            <option value="none">None</option>
            <option value="bounce">Bounce</option>
            <option value="fade">Fade In</option>
          </select>
        </div>

        <div>
          <label>Text Color</label>
          <input type="color" id="textColorInput" value="#ffffff" onchange="updateStyles()" style="width: 100%; height: 42px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; cursor: pointer; padding: 0;">
        </div>
      </div>

      <div class="checkbox-group">
        <label><input type="checkbox" id="boldInput" onchange="updateStyles()"> Bold</label>
        <label><input type="checkbox" id="italicInput" onchange="updateStyles()"> Italic</label>
      </div>
    </div>

  </div>

  <script>
    let ws = null;

    function connectWebSocket() {
      const roomId = document.getElementById('roomInput').value;
      const protocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
      const wsUrl = `${protocol}${window.location.host}/ws/ingest?room=${roomId}`;

      ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        console.log("Connected to ingest WebSocket");
        // Push initial styles upon connection
        updateStyles();
      };

      ws.onclose = () => {
        console.log("WebSocket disconnected. Reconnecting in 3s...");
        setTimeout(connectWebSocket, 3000);
      };
    }

    function updateLanguage() {
      if (ws && ws.readyState === WebSocket.OPEN) {
        const lang = document.getElementById('langSelect').value;
        ws.send(JSON.stringify({ type: 'set_language', lang }));
      }
    }

    function updateStyles() {
      const styles = {
        fontSize: document.getElementById('fontSizeInput').value + 'px',
        fontFamily: document.getElementById('fontFamilyInput').value,
        fontWeight: document.getElementById('boldInput').checked ? 'bold' : 'normal',
        fontStyle: document.getElementById('italicInput').checked ? 'italic' : 'normal',
        animation: document.getElementById('animationInput').value,
        textColor: document.getElementById('textColorInput').value
      };

      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'update_styles', styles }));
      }
    }

    // Initialize connection on load
    window.addEventListener('DOMContentLoaded', () => {
      connectWebSocket();
    });
  </script>
</body>
</html>
