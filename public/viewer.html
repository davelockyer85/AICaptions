<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Live Captions - AICaptions Viewer</title>
  
  <!-- Preconnect & Supabase JS SDK -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://euopdmwtowuxdzczwbul.supabase.co" crossorigin>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --border-color: #334155;
      --primary: #3b82f6;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --caption-size: 1.5rem;
    }
    
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
    }

    .logo {
      font-weight: 600;
      font-size: 1.1rem;
    }

    .language-picker {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .language-picker label {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .language-picker select {
      background: var(--bg-dark);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      text-align: center;
    }

    #translated-output {
      font-size: var(--caption-size);
      line-height: 1.6;
      max-width: 800px;
      word-break: break-word;
    }

    .status {
      font-size: 0.85rem;
      color: var(--text-muted);
      padding: 8px 16px;
      text-align: center;
      border-top: 1px solid var(--border-color);
      background-color: var(--card-bg);
    }
  </style>
</head>
<body>

  <!-- Header with Title and Language Switcher -->
  <header>
    <div class="logo">AICaptions Viewer</div>
    <div class="language-picker">
      <label for="language-select">Language:</label>
      <select id="language-select">
        <option value="en" selected>English</option>
        <option value="es">Spanish</option>
        <option value="fr">French</option>
        <option value="de">German</option>
        <option value="it">Italian</option>
        <option value="pt">Portuguese</option>
      </select>
    </div>
  </header>

  <!-- Main Caption Display Area -->
  <div class="container">
    <div id="translated-output">Connecting to room...</div>
  </div>

  <!-- Status Bar for Model Download & Connection Feedback -->
  <div id="status-bar" class="status">Initializing connection...</div>

  <script type="module">
    import { pipeline } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2';

    let currentTranslator = null;
    let activeLang = document.getElementById('language-select').value;
    let isSwitching = false;
    const statusBar = document.getElementById('status-bar');
    const outputElement = document.getElementById('translated-output');

    // Extract room parameter from URL (e.g. ?room=main-stage)
    const urlParams = new URLSearchParams(window.location.search);
    const room = urlParams.get('room') || urlParams.get('roomId') || 'main-stage';

    // Function to load or switch the translation model via Transformers.js
    async function loadTranslator(lang) {
      if (isSwitching) return;
      isSwitching = true;

      // If English is selected, clear translator so raw text displays directly
      if (lang === 'en') {
        currentTranslator = null;
        statusBar.innerText = `Connected (Showing English)`;
        isSwitching = false;
        return;
      }

      statusBar.innerText = `Loading model for English -> ${lang.toUpperCase()}...`;
      
      try {
        currentTranslator = await pipeline('translation', `Xenova/opus-mt-en-${lang}`);
        statusBar.innerText = `Ready (Translating live to ${lang.toUpperCase()})`;
      } catch (error) {
        console.error('Failed to load translation model:', error);
        statusBar.innerText = `Error loading model for ${lang.toUpperCase()}`;
      } finally {
        isSwitching = false;
      }
    }

    // Initial load on startup
    await loadTranslator(activeLang);

    // Listen for user changes in the dropdown
    document.getElementById('language-select').addEventListener('change', async (event) => {
      activeLang = event.target.value;
      await loadTranslator(activeLang);
    });

    // Establish WebSocket Connection to the Viewer Stream
    const protocol = location.protocol === "https:" ? "wss:" : "ws:";
    const wsUrl = `${protocol}//${location.host}/ws/viewer?room=${encodeURIComponent(room)}`;
    const socket = new WebSocket(wsUrl);

    socket.onopen = () => {
      statusBar.innerText = activeLang === 'en' ? 'Connected (Showing English)' : `Ready (Translating live to ${activeLang.toUpperCase()})`;
      outputElement.innerText = "Waiting for captions...";
    };

    socket.onmessage = async (event) => {
      let rawText = event.data;

      // Parse JSON if messages are sent as structured objects
      try {
        const parsed = JSON.parse(event.data);
        if (parsed.text) rawText = parsed.text;
      } catch (e) {
        // Fallback for plain text messages
      }

      let displayText = rawText;

      // Translate if a target language is chosen and translator is ready
      if (currentTranslator && !isSwitching && activeLang !== 'en') {
        try {
          const output = await currentTranslator(rawText);
          displayText = output[0].translation_text;
        } catch (err) {
          console.error('Translation error:', err);
        }
      }

      outputElement.innerText = displayText;
    };

    socket.onerror = (err) => {
      console.error("WebSocket Error:", err);
      statusBar.innerText = "Connection Error";
    };

    socket.onclose = () => {
      statusBar.innerText = "Disconnected from server";
    };
  </script>
</body>
</html>
