<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Live Captions - AICaptions</title>

  <!-- Preconnect & Supabase JS SDK -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://euopdmwtowuxdzczwbul.supabase.co" crossorigin>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Google Translate Initialization -->
  <script type="text/javascript">
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({
        pageLanguage: 'en',
        includedLanguages: 'es,fr,de,zh-CN,ja,ar',
        layout: google.translate.TranslateElement.InlineLayout.SIMPLE
      }, 'google_translate_element');
    }
  </script>
  <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --border-color: #334155;
      --primary: #3b82f6;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --caption-size: 1.75rem;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem 1rem;
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      flex-shrink: 0;
    }

    .brand {
      font-weight: 600;
      font-size: 1.1rem;
    }

    #google_translate_element {
      display: inline-block;
    }

    .goog-te-gadget {
      color: var(--text-muted) !important;
      font-size: 0.85rem !important;
    }

    .goog-te-gadget .goog-te-combo {
      background-color: var(--bg-dark);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.85rem;
      outline: none;
    }

    /* Main Caption Container */
    #caption-container {
      flex: 1;
      padding: 2rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      font-size: var(--caption-size);
      line-height: 1.6;
    }

    .caption-line {
      animation: fadeIn 0.2s ease-in-out;
      word-wrap: break-word;
    }

    .caption-interim {
      color: var(--text-muted);
      font-style: italic;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <header class="top-bar">
    <div class="brand">🎙️ AICaptions</div>
    <div id="google_translate_element"></div>
  </header>

  <!-- Live Caption Display Window -->
  <main id="caption-container">
    <div id="status-message" class="caption-line caption-interim">Connecting to caption room...</div>
  </main>

  <script>
    // 1. Get Room ID from URL
    const urlParams = new URLSearchParams(window.location.search);
    const roomId = urlParams.get('room') || 'default';

    // 2. Initialize Supabase Client
    const SUPABASE_URL = 'https://euopdmwtowuxdzczwbul.supabase.co';
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY'; // Ensure your project's anon key is set here

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const container = document.getElementById('caption-container');
    const statusMsg = document.getElementById('status-message');

    let interimElement = null;

    // 3. Connect & Listen to Wildcard Broadcast Events
    const channel = supabaseClient.channel(`room:${roomId}`)
      .on('broadcast', { event: '*' }, (payload) => {
        console.log('Received Broadcast Event:', payload);
        if (statusMsg) statusMsg.remove();

        // Extract raw payload data
        const rawData = payload.payload !== undefined ? payload.payload : payload;
        
        let text = '';
        let isFinal = true;

        // Extract text from string, text, transcript, message, or caption properties
        if (typeof rawData === 'string') {
          text = rawData;
        } else if (typeof rawData === 'object' && rawData !== null) {
          text = rawData.text || rawData.transcript || rawData.message || rawData.caption || rawData.content || '';
          
          if (rawData.is_final !== undefined) isFinal = Boolean(rawData.is_final);
          else if (rawData.isFinal !== undefined) isFinal = Boolean(rawData.isFinal);
        }

        if (!text || !text.trim()) return;

        if (isFinal) {
          if (interimElement) {
            interimElement.remove();
            interimElement = null;
          }
          const line = document.createElement('div');
          line.className = 'caption-line';
          line.textContent = text;
          container.appendChild(line);
        } else {
          if (!interimElement) {
            interimElement = document.createElement('div');
            interimElement.className = 'caption-line caption-interim';
            container.appendChild(interimElement);
          }
          interimElement.textContent = text;
        }

        container.scrollTop = container.scrollHeight;
      })
      .subscribe((status) => {
        if (status === 'SUBSCRIBED') {
          if (statusMsg) statusMsg.textContent = `Connected to room: ${roomId}. Waiting for speech...`;
        }
      });
  </script>
</body>
</html>
